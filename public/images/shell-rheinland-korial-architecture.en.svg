<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6b7684"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3182f6"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="820" height="360" rx="22" fill="#f2f4f6"/>

  <!-- Header -->
  <text x="32" y="42" font-size="20" font-weight="800" fill="#191f28" letter-spacing="-0.4">Shell Rheinland Autonomous Inspection Architecture</text>

  <!-- OT / Boundary / IT Column Zone Badges -->
  <rect x="32" y="60" width="206" height="26" rx="6" fill="#e5e8eb"/>
  <text x="135" y="77.5" font-size="11.5" font-weight="700" fill="#333d4b" text-anchor="middle">[OT] Field Fleet &amp; Docks</text>

  <rect x="268" y="60" width="284" height="26" rx="6" fill="#dbeafe"/>
  <text x="410" y="77.5" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">[OT/IT Boundary · On-prem] Middleware</text>

  <rect x="626" y="60" width="162" height="26" rx="6" fill="#e5e8eb"/>
  <text x="707" y="77.5" font-size="11.5" font-weight="700" fill="#333d4b" text-anchor="middle">[IT] Enterprise Ops</text>

  <!-- Col 1: Mixed Fleet Cards -->
  <rect x="32" y="98" width="206" height="54" rx="11" fill="#ffffff" stroke="#d1d6db" stroke-width="1.3"/>
  <text x="135" y="130" font-size="13.5" font-weight="800" fill="#191f28" text-anchor="middle">ExR-2 (Tracked Robot)</text>

  <rect x="32" y="162" width="206" height="54" rx="11" fill="#ffffff" stroke="#d1d6db" stroke-width="1.3"/>
  <text x="135" y="194" font-size="13.5" font-weight="800" fill="#191f28" text-anchor="middle">Spot (Quadruped Robot)</text>

  <rect x="32" y="226" width="206" height="54" rx="11" fill="#ffffff" stroke="#d1d6db" stroke-width="1.3"/>
  <text x="135" y="258" font-size="13.5" font-weight="800" fill="#191f28" text-anchor="middle">Drone-in-a-box</text>

  <!-- Connectors Col 1 -> Col 2 -->
  <path d="M 238 125 L 252 125 L 252 253 L 238 253" fill="none" stroke="#8b95a1" stroke-width="1.6"/>
  <line x1="238" y1="189" x2="264" y2="189" stroke="#6b7684" stroke-width="1.8" marker-end="url(#arrow-gray)"/>

  <!-- Col 2: Korial Platform -->
  <rect x="268" y="98" width="284" height="182" rx="13" fill="#eaf2fe" stroke="#3182f6" stroke-width="1.8"/>
  <text x="410" y="126" font-size="16" font-weight="800" fill="#1b64da" text-anchor="middle">Korial Platform</text>

  <rect x="284" y="140" width="252" height="58" rx="9" fill="#ffffff" stroke="#bfd7ff" stroke-width="1.2"/>
  <text x="410" y="164" font-size="13.5" font-weight="800" fill="#191f28" text-anchor="middle">Unified Fleet Control</text>
  <text x="410" y="185" font-size="11.5" font-weight="600" fill="#4e5968" text-anchor="middle">Single console replacing OEM apps</text>

  <rect x="284" y="206" width="252" height="58" rx="9" fill="#ffffff" stroke="#bfd7ff" stroke-width="1.2"/>
  <text x="410" y="230" font-size="13.5" font-weight="800" fill="#191f28" text-anchor="middle">Shared Vision &amp; Sensor AI</text>
  <text x="410" y="251" font-size="11.5" font-weight="600" fill="#4e5968" text-anchor="middle">Gauges · Valves · Thermal · Gas ppm</text>

  <!-- Connector Col 2 -> Col 3 -->
  <line x1="552" y1="189" x2="621" y2="189" stroke="#3182f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="588" y="163" font-size="11" font-weight="700" fill="#1b64da" text-anchor="middle">Baseline</text>
  <text x="588" y="179" font-size="11" font-weight="700" fill="#1b64da" text-anchor="middle">Deviation</text>

  <!-- Col 3: Shell IT Stack -->
  <rect x="626" y="98" width="162" height="182" rx="13" fill="#ffffff" stroke="#d1d6db" stroke-width="1.3"/>
  <text x="707" y="142" font-size="15.5" font-weight="800" fill="#191f28" text-anchor="middle">Shell IT Stack</text>
  <line x1="646" y1="158" x2="768" y2="158" stroke="#e5e8eb" stroke-width="1.2"/>
  <text x="707" y="188" font-size="12.5" font-weight="700" fill="#333d4b" text-anchor="middle">Operator Alerts</text>
  <text x="707" y="212" font-size="12" font-weight="600" fill="#4e5968" text-anchor="middle">EAM / Field Action</text>
  <rect x="646" y="234" width="122" height="26" rx="6" fill="#f2f4f6"/>
  <text x="707" y="251" font-size="11.5" font-weight="700" fill="#191f28" text-anchor="middle">Rapid Response</text>

  <!-- Bottom Principle Summary -->
  <rect x="32" y="298" width="756" height="42" rx="10" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <text x="410" y="324" font-size="12" font-weight="700" fill="#191f28" text-anchor="middle">
    Core Principle: <tspan fill="#1b64da">Decoupling intelligence (control &amp; AI) from hardware</tspan> → Zero vendor lock-in &amp; fleet agility
  </text>
</svg>
