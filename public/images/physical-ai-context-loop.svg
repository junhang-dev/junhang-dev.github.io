<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4e5968"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3182f6"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="920" height="430" rx="22" fill="#f2f4f6"/>

  <!-- Main Title -->
  <text x="48" y="44" font-size="20" font-weight="800" fill="#191f28" letter-spacing="-0.4">한눈에 보는 '설비 문맥(Asset Context)' 기반 선순환 아키텍처</text>

  <!-- Feedback Loop Arch (Step 4 -> Step 1) -->
  <path d="M 795 104 L 795 76 Q 795 68 787 68 L 145 68 Q 137 68 137 76 L 137 98" fill="none" stroke="#3182f6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
  <rect x="352" y="55" width="216" height="24" rx="12" fill="#dbeafe"/>
  <text x="460" y="71" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">누적 이력 기반 다음 점검 경로 추천</text>

  <!-- Step 1 -->
  <rect x="48" y="104" width="178" height="106" rx="12" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <text x="137" y="134" font-size="14.5" font-weight="800" fill="#191f28" text-anchor="middle">1. 수집 · 도크 동기화</text>
  <text x="137" y="160" font-size="12.5" fill="#4e5968" text-anchor="middle">드론·로봇개 순찰 촬영</text>
  <text x="137" y="180" font-size="12.5" fill="#6b7684" text-anchor="middle">도크 복귀 시 저장소 업로드</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="226" y1="157" x2="258" y2="157" stroke="#4e5968" stroke-width="1.8" marker-end="url(#arrow-gray)"/>

  <!-- Step 2 -->
  <rect x="262" y="104" width="178" height="106" rx="12" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <text x="351" y="134" font-size="14.5" font-weight="800" fill="#191f28" text-anchor="middle">2. AI 인퍼런스</text>
  <text x="351" y="160" font-size="12.5" fill="#4e5968" text-anchor="middle">결함·이상 의심 탐지</text>
  <text x="351" y="180" font-size="12.5" fill="#6b7684" text-anchor="middle">확인 체크포인트 제안</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="440" y1="157" x2="472" y2="157" stroke="#3182f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Step 3 (Highlighted Core) -->
  <rect x="476" y="100" width="210" height="114" rx="14" fill="#eaf2fe" stroke="#3182f6" stroke-width="1.8"/>
  <text x="581" y="132" font-size="15.5" font-weight="800" fill="#1b64da" text-anchor="middle">3. 설비 문맥 결합</text>
  <text x="581" y="158" font-size="12.5" font-weight="600" fill="#191f28" text-anchor="middle">영상 + 좌표 + 도면 + 이력</text>
  <rect x="498" y="172" width="166" height="24" rx="6" fill="#dbeafe"/>
  <text x="581" y="188" font-size="12" font-weight="800" fill="#1b64da" text-anchor="middle">▶ AI Ready Data 완성</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="686" y1="157" x2="714" y2="157" stroke="#3182f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Step 4 -->
  <rect x="718" y="104" width="154" height="106" rx="12" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <text x="795" y="134" font-size="14.5" font-weight="800" fill="#191f28" text-anchor="middle">4. 정비 · 재학습</text>
  <text x="795" y="160" font-size="12.5" fill="#4e5968" text-anchor="middle">정비요청(EAM) 발행</text>
  <text x="795" y="180" font-size="12.5" fill="#6b7684" text-anchor="middle">확정 라벨 모델 재투입</text>

  <!-- Foundation Merging Lines into Step 3 -->
  <path d="M 164 294 L 164 264 L 581 264" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="460" y1="294" x2="460" y2="264" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 756 294 L 756 264 L 581 264" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="581" y1="264" x2="581" y2="220" stroke="#3182f6" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="366" y="251" width="194" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="463" y="267" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">설비 ID 기준 1:1 문맥 연결</text>

  <!-- Foundation Layer Label -->
  <text x="48" y="282" font-size="13" font-weight="700" fill="#4e5968">사내 기반 데이터 요소</text>

  <!-- Foundation Cards (3 clean boxes) -->
  <rect x="48" y="294" width="232" height="92" rx="12" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <text x="164" y="328" font-size="15" font-weight="800" fill="#191f28" text-anchor="middle">통합 설비관리 마스터</text>
  <text x="164" y="352" font-size="12.5" fill="#6b7684" text-anchor="middle">설비번호 · 재질/두께</text>
  <text x="164" y="370" font-size="12.5" fill="#6b7684" text-anchor="middle">과거 정비·보수 이력</text>

  <rect x="344" y="294" width="232" height="92" rx="12" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <text x="460" y="328" font-size="15" font-weight="800" fill="#191f28" text-anchor="middle">공장 3D Map</text>
  <text x="460" y="352" font-size="12.5" fill="#6b7684" text-anchor="middle">실공간 좌표 체계</text>
  <text x="460" y="370" font-size="12.5" fill="#6b7684" text-anchor="middle">좌표 기반 모니터링 포인트</text>

  <rect x="640" y="294" width="232" height="92" rx="12" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <text x="756" y="328" font-size="15" font-weight="800" fill="#191f28" text-anchor="middle">스마트 P&amp;ID 도면</text>
  <text x="756" y="352" font-size="12.5" fill="#6b7684" text-anchor="middle">도면상 설비 위치</text>
  <text x="756" y="370" font-size="12.5" fill="#6b7684" text-anchor="middle">유체 계통 · 설비 연식</text>
</svg>
