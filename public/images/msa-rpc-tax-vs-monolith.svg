<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Outer Card Background -->
  <rect width="920" height="500" rx="22" fill="#f2f4f6"/>

  <!-- Main Title & Subtitle -->
  <text x="48" y="54" font-size="22" font-weight="800" fill="#191f28" letter-spacing="-0.4">네트워크를 건너는 호출 vs 한 프로세스 안의 호출</text>
  <text x="48" y="80" font-size="14" fill="#6b7684">아마존 프라임 비디오가 분산 컴포넌트를 단일 프로세스로 합쳐 인프라 비용을 90% 줄인 원리</text>

  <!-- ==================== SECTION 1: OVER-SPLIT MSA ==================== -->
  <!-- Section 1 Label & Badge -->
  <text x="48" y="122" font-size="15" font-weight="700" fill="#333d4b">1. 과도하게 쪼갠 MSA — 호출마다 붙는 네트워크 통행세 (RPC Tax)</text>
  <rect x="708" y="103" width="164" height="26" rx="13" fill="#fee2e2"/>
  <text x="790" y="120" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">CPU·비용의 절반 이상 소모</text>

  <!-- Node A: Media Converter -->
  <rect x="48" y="138" width="190" height="114" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <text x="143" y="176" font-size="16" font-weight="800" fill="#191f28" text-anchor="middle">영상 변환 서비스</text>
  <text x="143" y="200" font-size="13" fill="#6b7684" text-anchor="middle">오디오·비디오 분리 및</text>
  <text x="143" y="218" font-size="13" fill="#6b7684" text-anchor="middle">프레임 추출 (독립 컨테이너)</text>

  <!-- Arrow 1 -->
  <line x1="238" y1="195" x2="278" y2="195" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
  <path d="M272 189 L281 195 L272 201" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Middle Box: RPC Tax / S3 Hop -->
  <rect x="284" y="138" width="352" height="114" rx="14" fill="#fff5f5" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="460" y="166" font-size="14" font-weight="800" fill="#dc2626" text-anchor="middle">네트워크 및 스토리지 왕복 구간 (RPC Tax)</text>

  <!-- Step Pill 1 -->
  <rect x="300" y="180" width="98" height="54" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="349" y="203" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">데이터 포장</text>
  <text x="349" y="221" font-size="11.5" fill="#6b7684" text-anchor="middle">직렬화</text>

  <text x="405" y="211" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">→</text>

  <!-- Step Pill 2 -->
  <rect x="411" y="180" width="98" height="54" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="460" y="203" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">S3 업로드·다운</text>
  <text x="460" y="221" font-size="11.5" fill="#6b7684" text-anchor="middle">네트워크 전송</text>

  <text x="516" y="211" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">→</text>

  <!-- Step Pill 3 -->
  <rect x="522" y="180" width="98" height="54" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="571" y="203" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">데이터 해체</text>
  <text x="571" y="221" font-size="11.5" fill="#6b7684" text-anchor="middle">역직렬화</text>

  <!-- Arrow 2 -->
  <line x1="636" y1="195" x2="676" y2="195" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
  <path d="M670 189 L679 195 L670 201" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Node B: Defect Detector -->
  <rect x="682" y="138" width="190" height="114" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <text x="777" y="176" font-size="16" font-weight="800" fill="#191f28" text-anchor="middle">결함 감지 워커</text>
  <text x="777" y="200" font-size="13" fill="#6b7684" text-anchor="middle">화면 깨짐·오디오 싱크</text>
  <text x="777" y="218" font-size="13" fill="#6b7684" text-anchor="middle">불량 검사 (독립 서버리스)</text>

  <!-- ==================== SECTION 2: SINGLE-PROCESS MONOLITH ==================== -->
  <!-- Section 2 Label & Badge -->
  <text x="48" y="302" font-size="15" font-weight="700" fill="#333d4b">2. 단일 프로세스(모듈형 모놀리스) — 메모리 주소(포인터)만 즉시 전달</text>
  <rect x="708" y="283" width="164" height="26" rx="13" fill="#dbeafe"/>
  <text x="790" y="300" font-size="12" font-weight="700" fill="#1b64da" text-anchor="middle">인프라 비용 90% 절감</text>

  <!-- Outer Single Process Container -->
  <rect x="48" y="318" width="824" height="142" rx="16" fill="#eaf2fe" stroke="#3182f6" stroke-width="1.6"/>
  <text x="72" y="346" font-size="13.5" font-weight="800" fill="#1b64da">단일 프로세스 컨테이너 (하나의 공유 메모리 / RAM 공간)</text>

  <!-- Inner Module A -->
  <rect x="72" y="360" width="210" height="82" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="177" y="396" font-size="16" font-weight="800" fill="#191f28" text-anchor="middle">영상 변환 모듈</text>
  <text x="177" y="420" font-size="13" fill="#6b7684" text-anchor="middle">메모리 버퍼에 프레임 기록</text>

  <!-- Direct Pointer Arrow Left -->
  <line x1="282" y1="401" x2="346" y2="401" stroke="#1b64da" stroke-width="2.2"/>

  <!-- Center Pill: Memory Pointer -->
  <rect x="346" y="366" width="228" height="70" rx="12" fill="#1b64da"/>
  <text x="460" y="396" font-size="14.5" font-weight="800" fill="#ffffff" text-anchor="middle">메모리 주소(포인터)만 전달</text>
  <text x="460" y="418" font-size="12" fill="#dbeafe" text-anchor="middle">데이터 복사 · 포장 · 네트워크 비용 0</text>

  <!-- Direct Pointer Arrow Right -->
  <line x1="574" y1="401" x2="632" y2="401" stroke="#1b64da" stroke-width="2.2"/>
  <path d="M625 395 L635 401 L625 407" fill="none" stroke="#1b64da" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner Module B -->
  <rect x="638" y="360" width="210" height="82" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="743" y="396" font-size="16" font-weight="800" fill="#191f28" text-anchor="middle">결함 감지 모듈</text>
  <text x="743" y="420" font-size="13" fill="#6b7684" text-anchor="middle">같은 메모리 버퍼를 즉시 읽음</text>
</svg>
