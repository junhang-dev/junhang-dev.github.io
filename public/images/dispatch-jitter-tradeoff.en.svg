<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 400; fill: #64748b; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .label-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
      .axis-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
    </style>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
    <pattern id="red-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#fecaca" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="920" height="560" rx="16" class="bg" stroke="#cbd5e1" stroke-width="1" />

  <!-- Header -->
  <text x="36" y="42" class="title">Dispatch Synchronization &amp; The Double-Sided Loss Curve</text>
  <text x="36" y="66" class="subtitle">Immediate dispatch courier waste vs staged dispatch synchronization, and multi-objective loss minimization</text>

  <!-- PANEL 1: TIMELINE SYNCHRONIZATION COMPARISON (Top) -->
  <g transform="translate(36, 92)">
    <rect width="848" height="200" class="card-bg" filter="url(#shadow)" />
    
    <text x="20" y="28" class="section-label" fill="#2563eb">Part 1. On-the-Ground Synchronization by Dispatch Timing</text>

    <!-- CASE A: IMMEDIATE DISPATCH -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="130" height="24" rx="4" fill="#fee2e2" />
      <text x="65" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">❌ Immediate (t=0)</text>
      
      <!-- Timeline Track -->
      <line x1="140" y1="12" x2="700" y2="12" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
      
      <!-- Courier Travel (0 to 10m) -->
      <rect x="140" y="4" width="80" height="16" rx="4" fill="#60a5fa" />
      <text x="180" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Ride (10m)</text>
      
      <!-- Courier Idle Wait (10 to 38m) -->
      <rect x="220" y="4" width="252" height="16" rx="4" fill="url(#red-hatch)" stroke="#ef4444" stroke-width="1" />
      <text x="346" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">🚨 Courier Idle Street Waiting (28 Min Wasted!)</text>

      <!-- Food Prep Marker -->
      <circle cx="472" cy="12" r="6" fill="#10b981" />
      <text x="472" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">t=38m Food Ready</text>

      <text x="714" y="16" font-size="11" font-weight="700" fill="#dc2626">Result: Courier Churn</text>
    </g>

    <!-- Divider line -->
    <line x1="20" y1="114" x2="828" y2="114" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- CASE B: STAGED / DELAYED DISPATCH -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="130" height="24" rx="4" fill="#dcfce7" />
      <text x="65" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">✅ Staged (t=26)</text>
      
      <!-- Timeline Track -->
      <line x1="140" y1="12" x2="700" y2="12" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
      
      <!-- Holding Window (0 to 26m) -->
      <rect x="140" y="4" width="224" height="16" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="2,2" />
      <text x="252" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">Dispatch Held (26m Hold)</text>

      <!-- Courier Call & Travel (26 to 38m) -->
      <rect x="364" y="4" width="108" height="16" rx="4" fill="#3b82f6" />
      <text x="418" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Call + Ride (12m)</text>

      <!-- Sync Milestone at 38m -->
      <circle cx="472" cy="12" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2" />
      
      <rect x="490" y="0" width="190" height="24" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
      <text x="585" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">🎯 Arrival = Food Ready Sync!</text>

      <text x="714" y="16" font-size="11" font-weight="700" fill="#16a34a">Result: Zero-Wait Pickup</text>
    </g>
  </g>

  <!-- PANEL 2: ASYMMETRIC LOSS CURVE (Bottom) -->
  <g transform="translate(36, 310)">
    <rect width="848" height="224" class="card-bg" filter="url(#shadow)" />
    
    <text x="20" y="26" class="section-label" fill="#4f46e5">Part 2. Asymmetric Multi-Objective Loss Curve</text>

    <!-- Graph Coordinates -->
    <g transform="translate(80, 50)">
      <!-- Axes -->
      <line x1="0" y1="130" x2="680" y2="130" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="130" stroke="#94a3b8" stroke-width="1.5" />
      
      <!-- Axis Labels -->
      <text x="340" y="152" text-anchor="middle" class="axis-text">Courier Dispatch Trigger Time (Too Early ← Optimal Timing (t=26m) → Too Late)</text>
      <text x="-10" y="-8" text-anchor="start" class="axis-text">Total System Loss</text>

      <!-- Curve 1: Courier Wait Loss (Red, steeply drops from left) -->
      <path d="M 40 10 Q 180 115, 340 125 T 640 128" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
      <text x="70" y="26" font-size="11" font-weight="700" fill="#dc2626">Courier Idle Penalty (Steep slope)</text>
      
      <!-- Curve 2: Food Cold Loss (Orange, climbs up to the right) -->
      <path d="M 40 128 Q 300 125, 400 115 T 640 20" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
      <text x="520" y="46" font-size="11" font-weight="700" fill="#d97706">Food Cooling Penalty (Gentle slope)</text>

      <!-- Curve 3: Combined Convex Total Loss (Blue thick curve) -->
      <path d="M 40 20 C 140 120, 260 110, 340 70 C 420 50, 540 40, 640 30" fill="none" stroke="#2563eb" stroke-width="3" />
      
      <!-- Optimal Point Marker at x=340 -->
      <line x1="340" y1="20" x2="340" y2="130" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
      <circle cx="340" cy="74" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2" />
      
      <!-- Callout Badge -->
      <rect x="250" y="-6" width="180" height="32" rx="6" fill="#10b981" />
      <text x="340" y="10" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Optimal Dispatch Window (t=26m)</text>
      <text x="340" y="22" text-anchor="middle" font-size="9" font-weight="500" fill="#ecfdf5">Combined Loss Minimized (Sweet Spot)</text>
    </g>

    <!-- Legend / Formula Card on Right -->
    <g transform="translate(620, 50)">
      <rect width="208" height="136" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="14" y="24" font-size="11" font-weight="700" fill="#1e293b">Multi-objective Loss Function</text>
      <text x="14" y="48" font-family="monospace" font-size="11" font-weight="700" fill="#2563eb">Loss = α·T_wait + β·T_cold</text>
      
      <text x="14" y="74" font-size="10.5" font-weight="500" fill="#475569">
        • <tspan font-weight="700" fill="#dc2626">α (Courier Wait Weight):</tspan> High<br/>
          (&gt;5m waiting leads to reject)<br/>
        • <tspan font-weight="700" fill="#d97706">β (Food Cold Weight):</tspan> Moderate<br/>
          (Thermal bags buffer 3~5m)
      </text>
      <text x="14" y="124" font-size="10" font-weight="700" fill="#047857">➔ Slightly advance call for jitter</text>
    </g>
  </g>
</svg>