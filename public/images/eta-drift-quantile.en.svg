<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <!-- Pattern for late penalty hatched zone -->
    <pattern id="hatch-late-en" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#f43f5e" stroke-width="1.8" stroke-opacity="0.3"/>
    </pattern>
    <linearGradient id="curve-fill-rain-en" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3182f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3182f6" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="curve-fill-clear-en" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b95a1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b95a1" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="20" fill="#f8fafb"/>

  <!-- Header -->
  <text x="44" y="44" font-size="20" font-weight="800" fill="#191f28" letter-spacing="-0.3">Asymmetric Pinball Loss Function &amp; P85 Safety Margin Decision Boundary</text>
  <text x="44" y="68" font-size="13" fill="#6b7684">Why delivery systems avoid conditional mean (P50) to suppress the 50% tardiness risk via upper quantile serving</text>

  <!-- LEFT PANEL: ASYMMETRIC LOSS FUNCTION -->
  <rect x="44" y="92" width="410" height="358" rx="14" fill="#ffffff" stroke="#e5e8eb" stroke-width="1.2"/>
  <rect x="44" y="92" width="180" height="28" rx="8" fill="#f2f4f6"/>
  <text x="56" y="111" font-size="12" font-weight="800" fill="#4e5968">1. Asymmetric Cost Function</text>

  <!-- Axis for Loss Graph -->
  <line x1="74" y1="380" x2="424" y2="380" stroke="#d1d6db" stroke-width="1.5"/>
  <line x1="249" y1="140" x2="249" y2="380" stroke="#d1d6db" stroke-width="1.5"/>

  <!-- Zero Error Label (x = 249, y = 380) -->
  <circle cx="249" cy="380" r="4" fill="#191f28"/>
  <text x="249" y="400" font-size="12" font-weight="700" fill="#191f28" text-anchor="middle">Prediction Error = 0</text>
  <text x="249" y="416" font-size="11" fill="#8b95a1" text-anchor="middle">(Exact on-time arrival)</text>

  <!-- Left: Early Delivery (Over-prediction) - Low gentle slope -->
  <line x1="84" y1="340" x2="249" y2="380" stroke="#3182f6" stroke-width="2.5"/>
  <text x="140" y="324" font-size="12" font-weight="700" fill="#1b64da">Early (Over-prediction)</text>
  <text x="140" y="342" font-size="11" fill="#6b7684">Gentle cost (happy customer)</text>
  <text x="140" y="358" font-size="10.5" fill="#8b95a1">Slope ≈ 1 - q (0.15)</text>

  <!-- Right: Late Delivery (Under-prediction) - Extremely steep slope -->
  <line x1="249" y1="380" x2="394" y2="150" stroke="#f43f5e" stroke-width="3"/>
  <text x="320" y="190" font-size="12.5" font-weight="800" fill="#e11d48">Late (Under-prediction)</text>
  <text x="320" y="210" font-size="11" font-weight="700" fill="#e11d48">Severe penalty (churn &amp; CS)</text>
  <text x="320" y="228" font-size="10.5" fill="#f43f5e">Slope ≈ q (0.85)</text>

  <!-- Callout note inside left panel -->
  <rect x="64" y="132" width="160" height="52" rx="6" fill="#f9fafb" stroke="#e5e8eb" stroke-width="1"/>
  <text x="74" y="152" font-size="11.5" font-weight="800" fill="#191f28">Pinball Loss Shape</text>
  <text x="74" y="170" font-size="11" fill="#6b7684">Late penalty &gt;&gt; Early buffer</text>

  <!-- RIGHT PANEL: PROBABILITY DENSITY & DECISION BOUNDARY -->
  <rect x="474" y="92" width="442" height="358" rx="14" fill="#ffffff" stroke="#e5e8eb" stroke-width="1.2"/>
  <rect x="474" y="92" width="200" height="28" rx="8" fill="#e8f3ff"/>
  <text x="486" y="111" font-size="12" font-weight="800" fill="#1b64da">2. Probability Density &amp; Decision Line</text>

  <!-- Time Axis for Right Panel -->
  <line x1="494" y1="380" x2="896" y2="380" stroke="#d1d6db" stroke-width="1.5"/>

  <!-- Ticks -->
  <text x="544" y="400" font-size="11.5" fill="#8b95a1" text-anchor="middle">25 min</text>
  <text x="614" y="400" font-size="11.5" fill="#8b95a1" text-anchor="middle">35 min</text>
  <text x="694" y="400" font-size="12" font-weight="800" fill="#4e5968" text-anchor="middle">48 min</text>
  <text x="694" y="416" font-size="11" fill="#4e5968" text-anchor="middle">(Actual Hand-off)</text>

  <text x="804" y="400" font-size="12.5" font-weight="800" fill="#1b64da" text-anchor="middle">60 min</text>
  <text x="804" y="416" font-size="11" font-weight="700" fill="#1b64da" text-anchor="middle">(Served P85 ETA)</text>

  <text x="874" y="400" font-size="11.5" fill="#8b95a1" text-anchor="middle">75 min</text>

  <!-- Curve A: Clear Day (Narrow Gray Curve) -->
  <path d="M 504 380 C 534 380, 554 250, 584 250 C 614 250, 634 380, 664 380 Z" fill="url(#curve-fill-clear-en)"/>
  <path d="M 504 380 C 534 380, 554 250, 584 250 C 614 250, 634 380, 664 380" fill="none" stroke="#8b95a1" stroke-width="1.8"/>
  <text x="584" y="238" font-size="11.5" font-weight="700" fill="#8b95a1" text-anchor="middle">Clear Day Baseline</text>

  <!-- Curve B: Rainy Friday (Broad Right-skewed Blue Curve) -->
  <!-- Peak around 48m (x = 694, y = 265) -->
  <path d="M 554 380 C 614 380, 654 265, 694 265 C 744 265, 784 380, 874 380 Z" fill="url(#curve-fill-rain-en)"/>
  <path d="M 554 380 C 614 380, 654 265, 694 265 C 744 265, 784 380, 874 380" fill="none" stroke="#3182f6" stroke-width="2.5"/>

  <!-- Hatched Area: Late delivery zone if P50 (48m) was served -->
  <path d="M 694 265 C 744 265, 784 380, 874 380 L 694 380 Z" fill="url(#hatch-late-en)"/>

  <!-- P50 Cutoff Line and High-Contrast Labeling -->
  <line x1="694" y1="205" x2="694" y2="380" stroke="#e11d48" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="660" y="172" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">If serving mean (P50)</text>
  <text x="660" y="188" font-size="11.5" font-weight="800" fill="#e11d48" text-anchor="middle">50% orders arrive late</text>
  <text x="660" y="202" font-size="10.5" fill="#f43f5e" text-anchor="middle">(Hatched area = SLA breach)</text>

  <!-- P85 Cutoff Line (The Decision Boundary at 60m) -->
  <line x1="804" y1="300" x2="804" y2="380" stroke="#1b64da" stroke-width="2.5"/>
  <polygon points="804,288 798,300 810,300" fill="#1b64da"/>
  <text x="816" y="238" font-size="12" font-weight="800" fill="#1b64da" text-anchor="middle">P85 Decision Line (60m)</text>
  <text x="816" y="254" font-size="11" font-weight="700" fill="#1b64da" text-anchor="middle">Tardiness capped at 15%</text>
  <text x="816" y="270" font-size="10.5" fill="#4e5968" text-anchor="middle">Arriving at 48m gives 12m buffer</text>

  <!-- Top note banner in right panel -->
  <rect x="494" y="126" width="402" height="30" rx="6" fill="#f9fafb" stroke="#e5e8eb" stroke-width="1"/>
  <text x="695" y="146" font-size="11" font-weight="700" fill="#333d4b" text-anchor="middle">Rule: High variance shifts the decision boundary rightward to enforce safety buffer</text>
</svg>