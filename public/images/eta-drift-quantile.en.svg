<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Outer Card Background -->
  <rect width="920" height="440" rx="22" fill="#f2f4f6"/>

  <!-- Main Title -->
  <text x="48" y="52" font-size="21" font-weight="800" fill="#191f28" letter-spacing="-0.4">Rainfall Data Drift &amp; Quantile Regression Safety Margins</text>
  <text x="48" y="78" font-size="13.5" fill="#6b7684">Why delivery systems serve P85 instead of P50 (mean) during high-variance weather events</text>

  <!-- Plot Area -->
  <rect x="48" y="104" width="824" height="300" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>

  <!-- Grid lines -->
  <line x1="88" y1="340" x2="832" y2="340" stroke="#8b95a1" stroke-width="1.5"/>

  <!-- X Axis Labels (Time in minutes) -->
  <text x="180" y="364" font-size="12" fill="#8b95a1" text-anchor="middle">20 min</text>
  <text x="310" y="364" font-size="12" fill="#8b95a1" text-anchor="middle">30 min</text>
  <text x="440" y="364" font-size="12" fill="#8b95a1" text-anchor="middle">40 min</text>
  <text x="540" y="364" font-size="12.5" font-weight="700" fill="#4e5968" text-anchor="middle">48 min (Actual Delivery)</text>
  <line x1="540" y1="340" x2="540" y2="346" stroke="#4e5968" stroke-width="1.5"/>
  <text x="700" y="364" font-size="12.5" font-weight="800" fill="#1b64da" text-anchor="middle">60 min (Displayed ETA)</text>
  <line x1="700" y1="340" x2="700" y2="346" stroke="#1b64da" stroke-width="1.5"/>
  <text x="810" y="364" font-size="12" fill="#8b95a1" text-anchor="middle">75 min</text>

  <!-- Curve 1: Sunny Day Normal Distribution (Grey, Tight) -->
  <!-- Peak around 30 min (x=310) -->
  <path d="M 120 340 C 210 340, 260 170, 310 170 C 360 170, 410 340, 500 340 Z" fill="#e5e8eb" fill-opacity="0.6"/>
  <path d="M 120 340 C 210 340, 260 170, 310 170 C 360 170, 410 340, 500 340" fill="none" stroke="#8b95a1" stroke-width="2"/>
  <text x="310" y="152" font-size="13" font-weight="700" fill="#6b7684" text-anchor="middle">Clear Day Baseline (Low Variance)</text>
  <text x="310" y="196" font-size="11.5" fill="#4e5968" text-anchor="middle">Centered around 30 min</text>

  <!-- Curve 2: Rainy Friday Distribution (Blue, Wide & Right-shifted) -->
  <!-- Peak around 48 min (x=540), long tail up to 75 min -->
  <path d="M 240 340 C 360 340, 440 210, 540 210 C 640 210, 720 340, 810 340 Z" fill="#eaf2fe" fill-opacity="0.7"/>
  <path d="M 240 340 C 360 340, 440 210, 540 210 C 640 210, 720 340, 810 340" fill="none" stroke="#3182f6" stroke-width="2.5"/>

  <!-- P50 Line (Mean/Median of Rainy Day: 48 min, x=540) -->
  <line x1="540" y1="210" x2="540" y2="340" stroke="#4e5968" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="540" y="194" font-size="12" font-weight="700" fill="#4e5968" text-anchor="middle">P50 (Median: 48 min)</text>
  <text x="540" y="240" font-size="11" fill="#6b7684" text-anchor="middle">If serving mean,</text>
  <text x="540" y="256" font-size="11" fill="#e11d48" font-weight="700" text-anchor="middle">50% orders arrive late</text>

  <!-- P85 Line (Upper Quantile: 60 min, x=700) -->
  <line x1="700" y1="262" x2="700" y2="340" stroke="#1b64da" stroke-width="2.2"/>
  <polygon points="700,254 694,264 706,264" fill="#1b64da"/>
  <text x="700" y="238" font-size="13" font-weight="800" fill="#1b64da" text-anchor="middle">P85 Served (60 min)</text>
  <text x="700" y="290" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">Safety buffer preserved</text>
  <text x="700" y="306" font-size="11" fill="#4e5968" text-anchor="middle">85% on-time rate met</text>

  <!-- Explanatory Callout Box (Right Top) -->
  <rect x="555" y="118" width="300" height="66" rx="8" fill="#f8fafb" stroke="#e5e8eb" stroke-width="1"/>
  <text x="568" y="138" font-size="12" font-weight="800" fill="#191f28">Asymmetric Business Cost</text>
  <text x="568" y="156" font-size="11" fill="#4e5968">• Under-prediction (late): CS churn &amp; severe friction</text>
  <text x="568" y="172" font-size="11" fill="#4e5968">• Conservative P85: arriving at 48m satisfies users</text>
</svg>