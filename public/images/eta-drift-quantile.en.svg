<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Outer Card Background -->
  <rect width="920" height="460" rx="22" fill="#f2f4f6"/>

  <!-- Main Title -->
  <text x="48" y="52" font-size="21" font-weight="800" fill="#191f28" letter-spacing="-0.4">Rainfall Data Drift &amp; Quantile Regression Safety Margins</text>
  <text x="48" y="78" font-size="13.5" fill="#6b7684">Why delivery systems serve P85 instead of P50 (mean) during high-variance weather events</text>

  <!-- Plot Area -->
  <rect x="48" y="104" width="824" height="326" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>

  <!-- Grid Baseline -->
  <line x1="88" y1="360" x2="832" y2="360" stroke="#8b95a1" stroke-width="1.5"/>

  <!-- X Axis Labels (Time in minutes) -->
  <text x="180" y="386" font-size="12" fill="#8b95a1" text-anchor="middle">20 min</text>
  <text x="310" y="386" font-size="12" fill="#8b95a1" text-anchor="middle">30 min</text>
  <text x="440" y="386" font-size="12" fill="#8b95a1" text-anchor="middle">40 min</text>

  <!-- 48 min Tick & Label -->
  <line x1="540" y1="360" x2="540" y2="368" stroke="#4e5968" stroke-width="1.6"/>
  <text x="540" y="386" font-size="13" font-weight="800" fill="#4e5968" text-anchor="middle">48 min</text>
  <text x="540" y="404" font-size="11.5" fill="#6b7684" text-anchor="middle">(Actual Delivery)</text>

  <!-- 60 min Tick & Label -->
  <line x1="690" y1="360" x2="690" y2="368" stroke="#1b64da" stroke-width="2"/>
  <text x="690" y="386" font-size="13.5" font-weight="800" fill="#1b64da" text-anchor="middle">60 min</text>
  <text x="690" y="404" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">(Displayed ETA)</text>

  <text x="800" y="386" font-size="12" fill="#8b95a1" text-anchor="middle">75 min</text>

  <!-- Curve 1: Sunny Day Normal Distribution (Grey, Tight) -->
  <path d="M 140 360 C 220 360, 260 190, 310 190 C 360 190, 400 360, 480 360 Z" fill="#e5e8eb" fill-opacity="0.5"/>
  <path d="M 140 360 C 220 360, 260 190, 310 190 C 360 190, 400 360, 480 360" fill="none" stroke="#8b95a1" stroke-width="2"/>
  <text x="310" y="170" font-size="13" font-weight="800" fill="#6b7684" text-anchor="middle">Clear Day Baseline (Low Variance)</text>
  <text x="310" y="214" font-size="11.5" fill="#4e5968" text-anchor="middle">Centered around 30 min</text>

  <!-- Curve 2: Rainy Friday Distribution (Blue, Wide & Right-shifted) -->
  <path d="M 260 360 C 370 360, 450 230, 540 230 C 630 230, 710 360, 810 360 Z" fill="#eaf2fe" fill-opacity="0.7"/>
  <path d="M 260 360 C 370 360, 450 230, 540 230 C 630 230, 710 360, 810 360" fill="none" stroke="#3182f6" stroke-width="2.5"/>

  <!-- P50 Line (Mean/Median: 48 min, x=540) -->
  <line x1="540" y1="230" x2="540" y2="360" stroke="#4e5968" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="540" y="214" font-size="12" font-weight="700" fill="#4e5968" text-anchor="middle">P50 (Median: 48 min)</text>
  <text x="540" y="262" font-size="11.5" fill="#6b7684" text-anchor="middle">If serving mean,</text>
  <text x="540" y="280" font-size="11.5" fill="#e11d48" font-weight="700" text-anchor="middle">50% orders arrive late</text>

  <!-- P85 Line & Indicator (60 min, x=690) -->
  <line x1="690" y1="285" x2="690" y2="360" stroke="#1b64da" stroke-width="2.4"/>
  <polygon points="690,270 683,286 697,286" fill="#1b64da"/>
  <text x="690" y="252" font-size="13.5" font-weight="800" fill="#1b64da" text-anchor="middle">P85 Served (60 min)</text>
  <text x="690" y="312" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">Safety buffer preserved</text>
  <text x="690" y="328" font-size="11" fill="#4e5968" text-anchor="middle">85% on-time rate met</text>

  <!-- Explanatory Callout Box (Top Right) -->
  <rect x="545" y="118" width="310" height="74" rx="8" fill="#f8fafb" stroke="#d1d6db" stroke-width="1"/>
  <text x="560" y="140" font-size="12" font-weight="800" fill="#191f28">Asymmetric Business Cost</text>
  <text x="560" y="160" font-size="11" fill="#4e5968">• Under-prediction (late): CS churn &amp; severe friction</text>
  <text x="560" y="177" font-size="11" fill="#4e5968">• Conservative P85: arriving at 48m satisfies users</text>
</svg>