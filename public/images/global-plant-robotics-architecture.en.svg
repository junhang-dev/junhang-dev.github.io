<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow-up-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3182f6"/>
    </marker>
    <marker id="arrow-up-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6b7684"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="920" height="530" rx="22" fill="#f2f4f6"/>

  <!-- Header -->
  <text x="48" y="46" font-size="21" font-weight="800" fill="#191f28" letter-spacing="-0.4">4-Layer Plant Reference: Decoupling Collection from Context</text>
  <text x="48" y="70" font-size="13.5" fill="#6b7684">Vendor-neutral unified pipeline (Shell pattern) + 3D/P&amp;ID Asset Context binding (Equinor pattern)</text>

  <!-- Layer 4 (Top) -->
  <rect x="48" y="92" width="824" height="84" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <rect x="68" y="108" width="116" height="22" rx="6" fill="#f2f4f6"/>
  <text x="126" y="123" font-size="11" font-weight="700" fill="#4e5968" text-anchor="middle">LAYER 4 · CONSUME</text>
  <text x="196" y="124" font-size="15.5" font-weight="800" fill="#191f28">Everyday Plant Inspection View &amp; EAM Work Orders</text>
  <rect x="688" y="106" width="164" height="24" rx="12" fill="#f8f9fa" stroke="#e5e8eb"/>
  <text x="770" y="122" font-size="11" font-weight="700" fill="#4e5968" text-anchor="middle">Operators &amp; Reliability</text>
  <text x="68" y="154" font-size="12.5" fill="#4e5968">• Operators check anomalies inside familiar 3D/asset views (not separate robot apps) and issue EAM work orders</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="460" y1="196" x2="460" y2="180" stroke="#3182f6" stroke-width="2" marker-end="url(#arrow-up-blue)"/>
  <text x="472" y="191" font-size="11" font-weight="700" fill="#1b64da">Asset-Tag alerts &amp; snapshot links</text>

  <!-- Layer 3 (Middle-Upper - HIGHLIGHT) -->
  <rect x="48" y="200" width="824" height="94" rx="14" fill="#eaf2fe" stroke="#3182f6" stroke-width="1.8"/>
  <rect x="68" y="216" width="128" height="22" rx="6" fill="#3182f6"/>
  <text x="132" y="231" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">LAYER 3 · CONTEXT</text>
  <text x="208" y="232" font-size="15.5" font-weight="800" fill="#1b64da">Asset Context Binding Layer</text>
  <rect x="668" y="214" width="184" height="24" rx="12" fill="#dbeafe"/>
  <text x="760" y="230" font-size="11" font-weight="700" fill="#1b64da" text-anchor="middle">Equinor · Aker BP × Cognite</text>
  <text x="68" y="258" font-size="12.5" font-weight="600" fill="#191f28">• Maps each inspection point 1:1 to P&amp;ID node, 3D coordinates, and Asset Tag before missions run</text>
  <text x="68" y="280" font-size="12.5" fill="#333d4b">• Joins Historian trends &amp; repair logs to surface <tspan font-weight="700" fill="#1b64da">"bearing +20°C vs. yesterday"</tspan> instead of raw video files</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="460" y1="314" x2="460" y2="298" stroke="#6b7684" stroke-width="2" marker-end="url(#arrow-up-gray)"/>
  <text x="472" y="309" font-size="11" font-weight="600" fill="#4e5968">Unified standard media &amp; telemetry format</text>

  <!-- Layer 2 (Middle-Lower) -->
  <rect x="48" y="318" width="824" height="90" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <rect x="68" y="334" width="128" height="22" rx="6" fill="#e8f3ff"/>
  <text x="132" y="349" font-size="11" font-weight="700" fill="#1b64da" text-anchor="middle">LAYER 2 · COLLECT</text>
  <text x="208" y="350" font-size="15.5" font-weight="800" fill="#191f28">Common Ingestion Channel (Beyond OEM Apps)</text>
  <rect x="676" y="332" width="176" height="24" rx="12" fill="#f8f9fa" stroke="#e5e8eb"/>
  <text x="764" y="348" font-size="11" font-weight="700" fill="#4e5968" text-anchor="middle">Shell Rheinland × Korial</text>
  <text x="68" y="376" font-size="12.5" fill="#4e5968">• Syncs at dock and translates proprietary OEM formats into one standard schema (time, pose, media)</text>
  <text x="68" y="396" font-size="12.5" fill="#4e5968">• <tspan font-weight="700" fill="#333d4b">Swapping robot brands later</tspan> requires zero changes to back-end databases or AI models</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="460" y1="428" x2="460" y2="412" stroke="#6b7684" stroke-width="2" marker-end="url(#arrow-up-gray)"/>
  <text x="472" y="423" font-size="11" font-weight="600" fill="#4e5968">Batch upload via Dock</text>

  <!-- Layer 1 (Bottom) -->
  <rect x="48" y="432" width="824" height="78" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <rect x="68" y="446" width="110" height="22" rx="6" fill="#f2f4f6"/>
  <text x="123" y="461" font-size="11" font-weight="700" fill="#4e5968" text-anchor="middle">LAYER 1 · EDGE</text>
  <text x="190" y="462" font-size="15" font-weight="800" fill="#191f28">Mixed Field Fleet by Zone (Swappable Hardware Terminals)</text>

  <rect x="68" y="476" width="256" height="24" rx="6" fill="#fff5f5" stroke="#ffc9c9"/>
  <text x="196" y="492" font-size="11.5" font-weight="700" fill="#c92a2a" text-anchor="middle">Zone 1 Ex: Crawlers · ANYmal X</text>

  <rect x="338" y="476" width="234" height="24" rx="6" fill="#f8f9fa" stroke="#e5e8eb"/>
  <text x="455" y="492" font-size="11.5" font-weight="700" fill="#333d4b" text-anchor="middle">Stairs &amp; Floors: Spot</text>

  <rect x="586" y="476" width="266" height="24" rx="6" fill="#f8f9fa" stroke="#e5e8eb"/>
  <text x="719" y="492" font-size="11.5" font-weight="700" fill="#333d4b" text-anchor="middle">Wide/Aerial/Confined: Drones</text>
</svg>
