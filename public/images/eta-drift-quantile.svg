<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow-p85" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 8 L 5 0 L 10 8 z" fill="#1b64da"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="920" height="460" rx="22" fill="#f2f4f6"/>

  <!-- Main Title -->
  <text x="48" y="52" font-size="21" font-weight="800" fill="#191f28" letter-spacing="-0.4">우천 시 데이터 드리프트와 분위수 회귀(Quantile)의 안전 마진</text>
  <text x="48" y="78" font-size="13.5" fill="#6b7684">불확실성이 커진 날, 평균값(P50) 대신 P85를 안내해 지각 리스크(SLA 위반)를 방어하는 원리</text>

  <!-- Plot Area -->
  <rect x="48" y="104" width="824" height="326" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>

  <!-- Grid Baseline -->
  <line x1="88" y1="360" x2="832" y2="360" stroke="#8b95a1" stroke-width="1.5"/>

  <!-- X Axis Labels (Time in minutes) -->
  <text x="180" y="386" font-size="12" fill="#8b95a1" text-anchor="middle">20분</text>
  <text x="310" y="386" font-size="12" fill="#8b95a1" text-anchor="middle">30분</text>
  <text x="440" y="386" font-size="12" fill="#8b95a1" text-anchor="middle">40분</text>

  <!-- 48 min Tick & Label -->
  <line x1="540" y1="360" x2="540" y2="368" stroke="#4e5968" stroke-width="1.6"/>
  <text x="540" y="386" font-size="13" font-weight="800" fill="#4e5968" text-anchor="middle">48분</text>
  <text x="540" y="404" font-size="11.5" fill="#6b7684" text-anchor="middle">(실제 배달 도착)</text>

  <!-- 60 min Tick & Label -->
  <line x1="690" y1="360" x2="690" y2="368" stroke="#1b64da" stroke-width="2"/>
  <text x="690" y="386" font-size="13.5" font-weight="800" fill="#1b64da" text-anchor="middle">60분</text>
  <text x="690" y="404" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">(앱 화면 안내 ETA)</text>

  <text x="800" y="386" font-size="12" fill="#8b95a1" text-anchor="middle">75분</text>

  <!-- Curve 1: Sunny Day Normal Distribution (Grey, Tight) -->
  <!-- Peak around 30 min (x=310, y=190) -->
  <path d="M 140 360 C 220 360, 260 190, 310 190 C 360 190, 400 360, 480 360 Z" fill="#e5e8eb" fill-opacity="0.5"/>
  <path d="M 140 360 C 220 360, 260 190, 310 190 C 360 190, 400 360, 480 360" fill="none" stroke="#8b95a1" stroke-width="2"/>
  <text x="310" y="170" font-size="13" font-weight="800" fill="#6b7684" text-anchor="middle">맑은 날 평소 분포 (낮은 분산)</text>
  <text x="310" y="214" font-size="11.5" fill="#4e5968" text-anchor="middle">평균 30분 내외 수렴</text>

  <!-- Curve 2: Rainy Friday Distribution (Blue, Wide & Right-shifted) -->
  <!-- Peak around 48 min (x=540, y=230), long tail up to 810 -->
  <path d="M 260 360 C 370 360, 450 230, 540 230 C 630 230, 710 360, 810 360 Z" fill="#eaf2fe" fill-opacity="0.7"/>
  <path d="M 260 360 C 370 360, 450 230, 540 230 C 630 230, 710 360, 810 360" fill="none" stroke="#3182f6" stroke-width="2.5"/>

  <!-- P50 Line (Mean/Median: 48 min, x=540) -->
  <line x1="540" y1="230" x2="540" y2="360" stroke="#4e5968" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="540" y="214" font-size="12" font-weight="700" fill="#4e5968" text-anchor="middle">P50 (중앙값 48분)</text>
  <text x="540" y="262" font-size="11.5" fill="#6b7684" text-anchor="middle">단순 평균값 안내 시</text>
  <text x="540" y="280" font-size="11.5" fill="#e11d48" font-weight="700" text-anchor="middle">50% 고객 지각 경험</text>

  <!-- P85 Line & Indicator (60 min, x=690) -->
  <line x1="690" y1="285" x2="690" y2="360" stroke="#1b64da" stroke-width="2.4"/>
  <!-- Dedicated arrow point at top of P85 line -->
  <polygon points="690,270 683,286 697,286" fill="#1b64da"/>
  <text x="690" y="252" font-size="13.5" font-weight="800" fill="#1b64da" text-anchor="middle">P85 안내 (60분)</text>
  <text x="690" y="312" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">안전 마진 확보</text>
  <text x="690" y="328" font-size="11" fill="#4e5968" text-anchor="middle">85% 정시 도착 달성</text>

  <!-- Explanatory Callout Box (Top Right) -->
  <rect x="545" y="118" width="310" height="74" rx="8" fill="#f8fafb" stroke="#d1d6db" stroke-width="1"/>
  <text x="560" y="140" font-size="12" font-weight="800" fill="#191f28">비대칭 손실 (Asymmetric Cost)</text>
  <text x="560" y="160" font-size="11" fill="#4e5968">• 과소 예측(지각): 약속 위반으로 CS 인입 및 이탈 초래</text>
  <text x="560" y="177" font-size="11" fill="#4e5968">• 보수적 예측: 60분 안내 후 48분 도착은 고객 만족 유지</text>
</svg>