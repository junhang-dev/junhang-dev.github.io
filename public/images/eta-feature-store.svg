<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Outer Card Background -->
  <rect width="920" height="440" rx="22" fill="#f2f4f6"/>

  <!-- Main Title -->
  <text x="48" y="52" font-size="21" font-weight="800" fill="#191f28" letter-spacing="-0.4">배달 ETA 예측을 위한 Feature Store 이원화 구조</text>
  <text x="48" y="78" font-size="13.5" fill="#6b7684">과거의 긴 통계(배치)와 지금 당장의 현장 상태(스트리밍)가 하나의 추론 엔진에서 만나는 흐름</text>

  <!-- Left: Offline Batch Path (Grey Box) -->
  <rect x="48" y="104" width="370" height="210" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <rect x="64" y="120" width="136" height="26" rx="6" fill="#f2f4f6"/>
  <text x="132" y="137" font-size="12" font-weight="700" fill="#4e5968" text-anchor="middle">OFFLINE BATCH</text>

  <text x="64" y="172" font-size="16" font-weight="800" fill="#191f28">배치 피처 파이프라인</text>
  <text x="64" y="196" font-size="13" fill="#6b7684">데이터 웨어하우스 · 대용량 집계 (Polars / Spark)</text>

  <line x1="64" y1="214" x2="398" y2="214" stroke="#e5e8eb" stroke-width="1"/>

  <text x="64" y="240" font-size="13.5" font-weight="700" fill="#333d4b">축적된 장기 통계 피처</text>
  <text x="64" y="264" font-size="12.5" fill="#6b7684">• 매장별 최근 7일 요일·시간대별 평균 조리 시간</text>
  <text x="64" y="286" font-size="12.5" fill="#6b7684">• 메뉴 조합별 기본 난이도 (단일 메뉴 vs 복합 세트)</text>

  <!-- Right: Online Streaming Path (Blue Highlight Box) -->
  <rect x="442" y="104" width="430" height="210" rx="14" fill="#eaf2fe" stroke="#3182f6" stroke-width="1.5"/>
  <rect x="458" y="120" width="156" height="26" rx="6" fill="#d0e2fe"/>
  <text x="536" y="137" font-size="12" font-weight="700" fill="#1b64da" text-anchor="middle">ONLINE STREAMING</text>

  <text x="458" y="172" font-size="16" font-weight="800" fill="#1b64da">실시간 피처 파이프라인</text>
  <text x="458" y="196" font-size="13" fill="#4e5968">이벤트 브로커 (Kafka) → 인메모리 저장소 (Redis)</text>

  <line x1="458" y1="214" x2="852" y2="214" stroke="#bfd7ff" stroke-width="1"/>

  <text x="458" y="240" font-size="13.5" font-weight="700" fill="#1b64da">지금 당장의 현장 상태 피처</text>
  <text x="458" y="264" font-size="12.5" fill="#333d4b">• OSRM 실시간 도로망 기준 실제 주행 거리 및 소요 시간</text>
  <text x="458" y="286" font-size="12.5" fill="#333d4b">• 해당 매장의 최근 30분 미처리 주문 대기열과 라이더 공급 밀도</text>

  <!-- Connectors to ML Prediction Service -->
  <line x1="233" y1="314" x2="233" y2="344" stroke="#4e5968" stroke-width="1.6"/>
  <line x1="657" y1="314" x2="657" y2="344" stroke="#3182f6" stroke-width="1.6"/>
  <line x1="233" y1="344" x2="410" y2="344" stroke="#4e5968" stroke-width="1.6"/>
  <line x1="657" y1="344" x2="510" y2="344" stroke="#3182f6" stroke-width="1.6"/>
  <line x1="460" y1="344" x2="460" y2="362" stroke="#191f28" stroke-width="1.6"/>
  <path d="M454 358 L460 366 L466 358" fill="none" stroke="#191f28" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom: Low-Latency ML Prediction Service -->
  <rect x="48" y="366" width="824" height="52" rx="12" fill="#ffffff" stroke="#191f28" stroke-width="1.4"/>
  <text x="460" y="398" font-size="15" font-weight="800" fill="#191f28" text-anchor="middle">초저지연 추론 엔진 (Inference Service) → 결합 예측: "도착 예정 60분"</text>
</svg>