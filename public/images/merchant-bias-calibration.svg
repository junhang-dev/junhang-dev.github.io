<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 14px; }
      .card-amber { fill: #ffffff; stroke: #f59e0b; stroke-width: 1.5; rx: 14px; }
      .card-green { fill: #ffffff; stroke: #10b981; stroke-width: 2; rx: 14px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #64748b; }
      .badge-label { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #1e293b; }
      .col-sub { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
      .metric-large { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 28px; font-weight: 800; }
      .card-subtext { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
    </style>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" rx="18" class="bg" stroke="#cbd5e1" stroke-width="1" />

  <!-- Header -->
  <text x="44" y="44" class="title">사장님 수동 입력 편향 보정 (Merchant Bias Calibration)</text>
  <text x="44" y="68" class="subtitle">센서 없는 주방의 주관적 입력을 3대 물리 컨텍스트로 보정하여 실제 조리시간을 도출하는 구조</text>

  <!-- COLUMN 1: HUMAN INPUT (x: 44, w: 220, h: 290) -->
  <g transform="translate(44, 96)">
    <rect width="220" height="290" class="card-amber" filter="url(#card-shadow)" />
    
    <rect x="18" y="18" width="84" height="22" rx="4" fill="#fef3c7" />
    <text x="26" y="33" class="badge-label" fill="#b45309">Noisy Input</text>
    
    <text x="18" y="66" class="col-title">주방 포스기 수동 입력</text>
    <text x="18" y="86" class="col-sub">주관적 방어 입력 신호</text>

    <!-- POS Button Display -->
    <rect x="20" y="110" width="180" height="80" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" />
    <text x="110" y="148" text-anchor="middle" class="metric-large" fill="#b45309">[ 60분 ]</text>
    <text x="110" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#d97706">피크타임 방어 버퍼</text>

    <!-- Notice Box -->
    <rect x="18" y="214" width="184" height="52" rx="6" fill="#fee2e2" />
    <text x="110" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">❌ Ground Truth 신뢰 불가</text>
    <text x="110" y="252" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">그대로 믿을 시 음식 식음 유발</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 264 240 L 306 240" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

  <!-- COLUMN 2: 3 CONTEXT DECODERS (x: 316, w: 320, h: 290) -->
  <g transform="translate(316, 96)">
    <!-- Decoder 1 -->
    <g transform="translate(0, 0)">
      <rect width="320" height="86" class="card" filter="url(#card-shadow)" />
      <rect x="16" y="14" width="108" height="20" rx="4" fill="#e0e7ff" />
      <text x="22" y="28" class="badge-label" fill="#4338ca">HISTORICAL BIAS</text>
      
      <rect x="238" y="14" width="66" height="22" rx="4" fill="#dbeafe" />
      <text x="271" y="29" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">Δ -22분</text>

      <text x="16" y="54" class="col-title">매장 고유 편향 프로파일</text>
      <text x="16" y="72" class="card-subtext">30일 통계: 60분 입력 시 평균 38분 출고</text>
    </g>

    <!-- Decoder 2 -->
    <g transform="translate(0, 102)">
      <rect width="320" height="86" class="card" filter="url(#card-shadow)" />
      <rect x="16" y="14" width="96" height="20" rx="4" fill="#fef3c7" />
      <text x="22" y="28" class="badge-label" fill="#b45309">LIVE QUEUE</text>

      <rect x="226" y="14" width="78" height="22" rx="4" fill="#fef3c7" />
      <text x="265" y="29" text-anchor="middle" font-size="11" font-weight="800" fill="#b45309">대기 3건</text>

      <text x="16" y="54" class="col-title">실시간 주방 조리 적체량</text>
      <text x="16" y="72" class="card-subtext">Kafka 이벤트 스트림: 화구 가동률 75%</text>
    </g>

    <!-- Decoder 3 -->
    <g transform="translate(0, 204)">
      <rect width="320" height="86" class="card" filter="url(#card-shadow)" />
      <rect x="16" y="14" width="96" height="20" rx="4" fill="#ecfdf5" />
      <text x="22" y="28" class="badge-label" fill="#047857">RECIPE CAPA</text>

      <rect x="226" y="14" width="78" height="22" rx="4" fill="#ecfdf5" />
      <text x="265" y="29" text-anchor="middle" font-size="11" font-weight="800" fill="#047857">기본 18분</text>

      <text x="16" y="54" class="col-title">주문 메뉴 조리 난이도</text>
      <text x="16" y="72" class="card-subtext">단품 치킨 1마리 (표준 튀김 주기 준수)</text>
    </g>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <path d="M 636 139 L 680 180" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />
  <path d="M 636 241 L 680 241" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />
  <path d="M 636 343 L 680 300" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

  <!-- COLUMN 3: CALIBRATED PREP TIME (x: 690, w: 226, h: 290) -->
  <g transform="translate(690, 96)">
    <rect width="226" height="290" class="card-green" filter="url(#card-shadow)" />

    <rect x="18" y="18" width="104" height="22" rx="4" fill="#d1fae5" />
    <text x="26" y="33" class="badge-label" fill="#065f46">Bayesian Core</text>

    <text x="18" y="66" class="col-title">편향 보정 최종 예측</text>
    <text x="18" y="86" class="col-sub">방어 버퍼(-22분) 삭감</text>

    <!-- Formula Display -->
    <rect x="16" y="106" width="194" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="113" y="126" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#15803d">T = 60분 - 22분</text>
    <text x="113" y="142" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#16a34a">(사장님 입력 - 편향치)</text>

    <!-- Result Banner -->
    <rect x="16" y="166" width="194" height="66" rx="8" fill="#10b981" />
    <text x="113" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#ecfdf5">알고리즘 산출 조리시간</text>
    <text x="113" y="218" text-anchor="middle" class="metric-large" fill="#ffffff">38분</text>

    <!-- Action Trigger -->
    <rect x="16" y="244" width="194" height="30" rx="6" fill="#1e293b" />
    <text x="113" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8">⚡ 지연 배차 스케줄러 전송</text>
  </g>
</svg>