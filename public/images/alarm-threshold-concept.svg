<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Outer Frame -->
  <rect width="920" height="390" rx="22" fill="#f2f4f6"/>
  <rect x="28" y="24" width="864" height="342" rx="16" fill="#ffffff"/>

  <!-- Header -->
  <text x="64" y="68" font-size="20" font-weight="800" fill="#191f28" letter-spacing="-0.4">단순 온도 임계값만 쓰면 현업이 알람을 끄게 되는 이유</text>
  <text x="64" y="92" font-size="13.5" fill="#6b7684">수증기·햇빛 반사 등 현장 노이즈(점선)와 실제 설비 과열(실선)이 겹치는 구간을 설비 이력 비교로 분리해야 합니다.</text>

  <!-- Legend -->
  <line x1="64" y1="120" x2="92" y2="120" stroke="#9e3b24" stroke-width="2.2" stroke-dasharray="5 4"/>
  <text x="100" y="124" font-size="13" fill="#333d4b" font-weight="600">현장 노이즈 · 일시적 오탐 (수증기, 태양광 반사)</text>

  <line x1="410" y1="120" x2="438" y2="120" stroke="#1b64da" stroke-width="2.5"/>
  <text x="446" y="124" font-size="13" fill="#333d4b" font-weight="600">실제 설비 이상 징후 (베어링 마모, 보온재 파손)</text>

  <!-- Shaded Adoption Zone (Right of Threshold B) -->
  <rect x="610" y="148" width="210" height="142" fill="#eaf2fe"/>

  <!-- Axes -->
  <line x1="96" y1="290" x2="836" y2="290" stroke="#d1d6db" stroke-width="1.5"/>
  <text x="56" y="225" font-size="12.5" fill="#6b7684" transform="rotate(-90 56 225)" text-anchor="middle">감지 빈도 (개념도)</text>
  <text x="108" y="314" font-size="12.5" fill="#6b7684">낮음</text>
  <text x="808" y="314" font-size="12.5" fill="#6b7684">높음</text>
  <text x="466" y="326" font-size="13.5" font-weight="600" fill="#333d4b" text-anchor="middle">이상 신뢰도 점수 (단순 온도치 + 설비 과거 이력 편차)</text>

  <!-- Noise Curve (Dashed Brown/Red) -->
  <path d="M 105 288 C 180 284, 230 218, 315 218 C 400 218, 490 278, 660 289 L 820 289" fill="rgba(158,59,36,0.07)" stroke="#9e3b24" stroke-width="2.2" stroke-dasharray="6 4"/>

  <!-- True Anomaly Curve (Solid Blue) -->
  <path d="M 180 289 C 360 287, 480 265, 560 245 C 630 225, 675 162, 725 162 C 765 162, 795 205, 820 235" fill="none" stroke="#1b64da" stroke-width="2.6"/>

  <!-- Threshold A: Naive Temperature Cutoff -->
  <line x1="370" y1="148" x2="370" y2="290" stroke="#8b95a1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="370" y="140" font-size="13" font-weight="700" fill="#4e5968" text-anchor="middle">단순 온도 임계값</text>

  <!-- Callout Box for Threshold A -->
  <rect x="200" y="156" width="156" height="46" rx="8" fill="#ffffff" stroke="#e5e8eb" stroke-width="1"/>
  <text x="278" y="175" font-size="11.5" font-weight="700" fill="#9e3b24" text-anchor="middle">오탐이 함께 쏟아져</text>
  <text x="278" y="192" font-size="11.5" font-weight="700" fill="#9e3b24" text-anchor="middle">현업 알람 피로도 급증</text>

  <!-- Threshold B: Contextual Filter Cutoff -->
  <line x1="610" y1="148" x2="610" y2="290" stroke="#1b64da" stroke-width="2"/>
  <text x="610" y="140" font-size="13" font-weight="800" fill="#1b64da" text-anchor="middle">문맥 기반 필터 임계값</text>

  <!-- Adoption Label inside Blue Zone -->
  <text x="715" y="172" font-size="12" font-weight="700" fill="#1b64da" text-anchor="middle">기간계(SAP) 알림</text>
  <text x="715" y="188" font-size="12" font-weight="700" fill="#1b64da" text-anchor="middle">자동 발행 구간</text>
  <line x1="650" y1="198" x2="780" y2="198" stroke="#1b64da" stroke-width="1.5"/>
  <path d="M774 194 L781 198 L774 202" fill="none" stroke="#1b64da" stroke-width="1.5"/>
</svg>
