<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 556" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow-up-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3182f6"/>
    </marker>
    <marker id="arrow-up-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6b7684"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="920" height="556" rx="22" fill="#f2f4f6"/>

  <!-- Header -->
  <text x="48" y="46" font-size="21" font-weight="800" fill="#191f28" letter-spacing="-0.4">글로벌 선도사의 플랜트 Physical AI 4계층 참조 아키텍처</text>
  <text x="48" y="70" font-size="13.5" fill="#6b7684">하드웨어 종속을 끊는 '수집 미들웨어(Korial형)'와 문맥을 입히는 'DataOps(Cognite형)'의 계층 분리 구조</text>

  <!-- Layer 4 (Top): Applications & Operations -->
  <rect x="48" y="92" width="824" height="90" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <rect x="68" y="108" width="106" height="22" rx="6" fill="#f2f4f6"/>
  <text x="121" y="123" font-size="11.5" font-weight="700" fill="#4e5968" text-anchor="middle">LAYER 4 · 활용</text>
  <text x="186" y="124" font-size="15.5" font-weight="800" fill="#191f28">현업 원격 점검 · 에이전틱 AI · 기간계 정비 연동</text>
  <rect x="676" y="106" width="176" height="24" rx="12" fill="#f8f9fa" stroke="#e5e8eb"/>
  <text x="764" y="122" font-size="11.5" font-weight="700" fill="#4e5968" text-anchor="middle">ADNOC · Equinor InRobot</text>
  <text x="68" y="150" font-size="13" fill="#4e5968">• 일반 운전원·정비 엔지니어가 3D 트윈·대시보드에서 이상 탐지 리포트 조회 및 자연어 질의(ENERGYai 등)</text>
  <text x="68" y="170" font-size="13" fill="#4e5968">• 기존 설비관리 시스템(EAM/SAP PM)으로 정비요청(Work Order) 직접 발행 및 다음 순찰 경로 추천</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="460" y1="204" x2="460" y2="186" stroke="#3182f6" stroke-width="2" marker-end="url(#arrow-up-blue)"/>
  <text x="472" y="198" font-size="11" font-weight="700" fill="#1b64da">API / 경량 JSON · 스냅샷 링크</text>

  <!-- Layer 3 (Middle-Upper - HIGHLIGHT): DataOps & Contextualization -->
  <rect x="48" y="208" width="824" height="98" rx="14" fill="#eaf2fe" stroke="#3182f6" stroke-width="1.8"/>
  <rect x="68" y="224" width="118" height="22" rx="6" fill="#3182f6"/>
  <text x="127" y="239" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">LAYER 3 · 문맥화</text>
  <text x="198" y="240" font-size="15.5" font-weight="800" fill="#1b64da">산업용 DataOps &amp; 지식 그래프 기반 '에셋 바구니'</text>
  <rect x="668" y="222" width="184" height="24" rx="12" fill="#dbeafe"/>
  <text x="760" y="238" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">Equinor · Aker BP × Cognite</text>
  <text x="68" y="267" font-size="13" font-weight="600" fill="#191f28">• 로봇 원시 데이터(영상·열화상·음향) ↔ 설비 마스터(Asset Tag) · 스마트 P&amp;ID · 3D 좌표 · 시계열(Historian) 자동 매핑</text>
  <text x="68" y="289" font-size="13" fill="#333d4b">• 유체·재질·설비 연식·과거 정비이력을 결합해 AI 모델과 운전원이 바로 소비하는 <tspan font-weight="700" fill="#1b64da">'AI Ready Data'</tspan> 생성</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="460" y1="328" x2="460" y2="310" stroke="#6b7684" stroke-width="2" marker-end="url(#arrow-up-gray)"/>
  <text x="472" y="322" font-size="11" font-weight="600" fill="#4e5968">표준화된 미디어 · 텔레메트리 스트림</text>

  <!-- Layer 2 (Middle-Lower): Hardware-Agnostic Middleware -->
  <rect x="48" y="332" width="824" height="90" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <rect x="68" y="348" width="118" height="22" rx="6" fill="#e8f3ff"/>
  <text x="127" y="363" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">LAYER 2 · 수집 통합</text>
  <text x="198" y="364" font-size="15.5" font-weight="800" fill="#191f28">하드웨어 독립적 Fleet 관제 &amp; 데이터 정규화 미들웨어</text>
  <rect x="692" y="346" width="160" height="24" rx="12" fill="#f8f9fa" stroke="#e5e8eb"/>
  <text x="772" y="362" font-size="11.5" font-weight="700" fill="#4e5968" text-anchor="middle">Shell 라인란트 × Korial</text>
  <text x="68" y="390" font-size="13" fill="#4e5968">• 도크(Dock) 복귀 기반 배치 동기화 및 OT 폐쇄망·무선 음영 구간을 통과하는 안전한 데이터 수집</text>
  <text x="68" y="410" font-size="13" fill="#4e5968">• 제조사별로 제각각인 로봇·드론 관제 UI와 포맷을 단일 규격으로 추상화하여 <tspan font-weight="700" fill="#333d4b">특정 기체 벤더 종속성 차단</tspan></text>

  <!-- Arrow 1 -> 2 -->
  <line x1="460" y1="444" x2="460" y2="426" stroke="#6b7684" stroke-width="2" marker-end="url(#arrow-up-gray)"/>
  <text x="472" y="438" font-size="11" font-weight="600" fill="#4e5968">도크 동기화 (Dock Sync)</text>

  <!-- Layer 1 (Bottom): Field Edge Hardware -->
  <rect x="48" y="448" width="824" height="86" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <rect x="68" y="464" width="106" height="22" rx="6" fill="#f2f4f6"/>
  <text x="121" y="479" font-size="11.5" font-weight="700" fill="#4e5968" text-anchor="middle">LAYER 1 · 현장</text>
  <text x="186" y="480" font-size="15.5" font-weight="800" fill="#191f28">안전 구역·작업별 최적 혼성 하드웨어 (교체 가능한 수집 단말)</text>

  <rect x="68" y="494" width="248" height="28" rx="6" fill="#fff5f5" stroke="#ffc9c9"/>
  <text x="192" y="512" font-size="12" font-weight="700" fill="#c92a2a" text-anchor="middle">Zone 1 방폭: ExR-2 · ANYmal X · X30</text>

  <rect x="330" y="494" width="248" height="28" rx="6" fill="#f8f9fa" stroke="#e5e8eb"/>
  <text x="454" y="512" font-size="12" font-weight="700" fill="#333d4b" text-anchor="middle">비방폭 복합 계단: Spot 등</text>

  <rect x="592" y="494" width="260" height="28" rx="6" fill="#f8f9fa" stroke="#e5e8eb"/>
  <text x="722" y="512" font-size="12" font-weight="700" fill="#333d4b" text-anchor="middle">광역·고소·밀폐: 자율·케이지 드론</text>
</svg>
