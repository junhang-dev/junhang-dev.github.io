<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow-up-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3182f6"/>
    </marker>
    <marker id="arrow-up-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6b7684"/>
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect width="920" height="530" rx="22" fill="#f2f4f6"/>

  <!-- Header -->
  <text x="48" y="46" font-size="21" font-weight="800" fill="#191f28" letter-spacing="-0.4">해외 선도 사례의 4계층 구조: 수집과 문맥 연결의 분리</text>
  <text x="48" y="70" font-size="13.5" fill="#6b7684">기체 교체에 흔들리지 않는 '공통 수집 통로(Shell)'와 기존 화면에 꽂아주는 '설비 문맥(Equinor)' 계층</text>

  <!-- Layer 4 (Top) -->
  <rect x="48" y="92" width="824" height="84" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <rect x="68" y="108" width="106" height="22" rx="6" fill="#f2f4f6"/>
  <text x="121" y="123" font-size="11.5" font-weight="700" fill="#4e5968" text-anchor="middle">LAYER 4 · 활용</text>
  <text x="186" y="124" font-size="15.5" font-weight="800" fill="#191f28">현업 설비 화면 조회 · 정비 작업 연계</text>
  <rect x="692" y="106" width="160" height="24" rx="12" fill="#f8f9fa" stroke="#e5e8eb"/>
  <text x="772" y="122" font-size="11.5" font-weight="700" fill="#4e5968" text-anchor="middle">운전원 · 정비 엔지니어</text>
  <text x="68" y="154" font-size="13" fill="#4e5968">• 로봇 전용 화면 대신 평소 보던 3D·설비 화면에서 사진과 상태 변화를 확인하고 바로 정비요청 발행</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="460" y1="196" x2="460" y2="180" stroke="#3182f6" stroke-width="2" marker-end="url(#arrow-up-blue)"/>
  <text x="472" y="191" font-size="11" font-weight="700" fill="#1b64da">설비 ID 기반 요약 결과 · 스냅샷 연결</text>

  <!-- Layer 3 (Middle-Upper - HIGHLIGHT) -->
  <rect x="48" y="200" width="824" height="94" rx="14" fill="#eaf2fe" stroke="#3182f6" stroke-width="1.8"/>
  <rect x="68" y="216" width="118" height="22" rx="6" fill="#3182f6"/>
  <text x="127" y="231" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">LAYER 3 · 문맥화</text>
  <text x="198" y="232" font-size="15.5" font-weight="800" fill="#1b64da">설비 문맥(Asset Context) 연결 계층</text>
  <rect x="668" y="214" width="184" height="24" rx="12" fill="#dbeafe"/>
  <text x="760" y="230" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">Equinor · Aker BP × Cognite</text>
  <text x="68" y="258" font-size="13" font-weight="600" fill="#191f28">• 촬영 지점마다 P&amp;ID 도면 위치 · 3D 좌표 · 설비번호(Asset Tag)를 1:1로 사전 매핑</text>
  <text x="68" y="280" font-size="13" fill="#333d4b">• 공정 운전 데이터(Historian)와 과거 정비이력을 결합해 <tspan font-weight="700" fill="#1b64da">'어제보다 온도 20°C 상승'</tspan> 같은 AI Ready Data 생성</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="460" y1="314" x2="460" y2="298" stroke="#6b7684" stroke-width="2" marker-end="url(#arrow-up-gray)"/>
  <text x="472" y="309" font-size="11" font-weight="600" fill="#4e5968">단일 표준 형식으로 정리된 영상·계측 데이터</text>

  <!-- Layer 2 (Middle-Lower) -->
  <rect x="48" y="318" width="824" height="90" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <rect x="68" y="334" width="118" height="22" rx="6" fill="#e8f3ff"/>
  <text x="127" y="349" font-size="11.5" font-weight="700" fill="#1b64da" text-anchor="middle">LAYER 2 · 수집</text>
  <text x="198" y="350" font-size="15.5" font-weight="800" fill="#191f28">드론·로봇 공통 데이터 수집 통로 (제조사 앱 분리)</text>
  <rect x="692" y="332" width="160" height="24" rx="12" fill="#f8f9fa" stroke="#e5e8eb"/>
  <text x="772" y="348" font-size="11.5" font-weight="700" fill="#4e5968" text-anchor="middle">Shell 라인란트 × Korial</text>
  <text x="68" y="376" font-size="13" fill="#4e5968">• 도크 복귀 시 데이터를 받아 제조사마다 제각각인 포맷을 똑같은 표준 형식(시간·위치·이미지)으로 변환</text>
  <text x="68" y="396" font-size="13" fill="#4e5968">• <tspan font-weight="700" fill="#333d4b">기체를 다른 브랜드로 교체해도</tspan> 뒷단 데이터 구조와 AI 모델은 건드릴 필요 없음</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="460" y1="428" x2="460" y2="412" stroke="#6b7684" stroke-width="2" marker-end="url(#arrow-up-gray)"/>
  <text x="472" y="423" font-size="11" font-weight="600" fill="#4e5968">도크(Dock) 복귀 후 일괄 전송</text>

  <!-- Layer 1 (Bottom) -->
  <rect x="48" y="432" width="824" height="78" rx="14" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <rect x="68" y="446" width="106" height="22" rx="6" fill="#f2f4f6"/>
  <text x="121" y="461" font-size="11.5" font-weight="700" fill="#4e5968" text-anchor="middle">LAYER 1 · 현장</text>
  <text x="186" y="462" font-size="15" font-weight="800" fill="#191f28">구역·작업별 현장 로봇·드론 (언제든 교체 가능한 수집 단말)</text>

  <rect x="68" y="476" width="248" height="24" rx="6" fill="#fff5f5" stroke="#ffc9c9"/>
  <text x="192" y="492" font-size="11.5" font-weight="700" fill="#c92a2a" text-anchor="middle">Zone 1 방폭: 궤도 로봇 · ANYmal X</text>

  <rect x="330" y="476" width="248" height="24" rx="6" fill="#f8f9fa" stroke="#e5e8eb"/>
  <text x="454" y="492" font-size="11.5" font-weight="700" fill="#333d4b" text-anchor="middle">계단·지상 순찰: Spot 등 로봇개</text>

  <rect x="592" y="476" width="260" height="24" rx="6" fill="#f8f9fa" stroke="#e5e8eb"/>
  <text x="722" y="492" font-size="11.5" font-weight="700" fill="#333d4b" text-anchor="middle">광역·고소·밀폐: 자율·케이지 드론</text>
</svg>
