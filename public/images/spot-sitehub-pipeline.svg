<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Outer Card Background -->
  <rect width="920" height="430" rx="22" fill="#f2f4f6"/>

  <!-- Main Title -->
  <text x="48" y="56" font-size="22" font-weight="800" fill="#191f28" letter-spacing="-0.4">플랜트 로봇 데이터 파이프라인 한눈에 보기</text>

  <!-- Row 1 Label -->
  <text x="48" y="98" font-size="14.5" font-weight="700" fill="#333d4b">현장 수집과 도크 동기화</text>

  <!-- Box 1: Spot Robot -->
  <rect x="48" y="114" width="210" height="96" rx="12" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <text x="153" y="154" font-size="16.5" font-weight="800" fill="#191f28" text-anchor="middle">Spot 자율 순찰</text>
  <text x="153" y="180" font-size="13.5" fill="#6b7684" text-anchor="middle">열화상·게이지·음향 로컬 저장</text>

  <!-- Arrow 1 -->
  <line x1="258" y1="162" x2="322" y2="162" stroke="#4e5968" stroke-width="1.6"/>
  <path d="M316 156 L325 162 L316 168" fill="none" stroke="#4e5968" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="291" y="148" font-size="12" fill="#6b7684" text-anchor="middle">임무 종료</text>

  <!-- Box 2: Spot Dock & On-Premise Site Hub (Blue Highlight) -->
  <rect x="328" y="114" width="544" height="96" rx="12" fill="#eaf2fe" stroke="#3182f6" stroke-width="1.5"/>
  <text x="356" y="150" font-size="17" font-weight="800" fill="#1b64da">Site Hub (온프레미스 서버)</text>
  <text x="568" y="150" font-size="13.5" fill="#4e5968">외부 클라우드 반출 없는 공장 내부망 처리</text>
  <text x="356" y="180" font-size="13.5" fill="#4e5968">Spot Dock 도킹 시 사내 무선망으로 회차 데이터 일괄 수집 · Orbit 관제 구동</text>

  <!-- Vertical Dashed Connector -->
  <line x1="600" y1="210" x2="600" y2="262" stroke="#3182f6" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M594 256 L600 265 L606 256" fill="none" stroke="#3182f6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="616" y="236" font-size="12.5" fill="#4e5968">원본 미디어는 내부 보관,</text>
  <text x="616" y="253" font-size="12.5" fill="#4e5968">점검 지점별 분석 실행</text>

  <!-- Row 2 Label -->
  <text x="48" y="252" font-size="14.5" font-weight="700" fill="#333d4b">사내 분석과 기간계 실행</text>

  <!-- Box 3: Plant Master Mapping -->
  <rect x="48" y="268" width="210" height="118" rx="12" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <text x="153" y="314" font-size="16.5" font-weight="800" fill="#191f28" text-anchor="middle">설비 마스터 기준</text>
  <text x="153" y="340" font-size="13.5" fill="#6b7684" text-anchor="middle">설비 ID (Asset Tag) ·</text>
  <text x="153" y="360" font-size="13.5" fill="#6b7684" text-anchor="middle">과거 운전 이력 기준값</text>

  <!-- Arrow 2 -->
  <line x1="258" y1="327" x2="322" y2="327" stroke="#4e5968" stroke-width="1.6"/>
  <path d="M316 321 L325 327 L316 333" fill="none" stroke="#4e5968" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="291" y="313" font-size="12" fill="#6b7684" text-anchor="middle">기준 매핑</text>

  <!-- Box 4: Spot Extensions & Webhook (Blue Highlight) -->
  <rect x="328" y="268" width="320" height="118" rx="12" fill="#eaf2fe" stroke="#3182f6" stroke-width="1.5"/>
  <text x="356" y="302" font-size="16.5" font-weight="800" fill="#1b64da">Spot Extensions &amp; API</text>
  <text x="356" y="328" font-size="13.5" fill="#4e5968">게이지 수치 판독 · 열화상 오탐 필터링</text>
  <line x1="356" y1="344" x2="620" y2="344" stroke="#bfd7ff" stroke-width="1.2"/>
  <text x="356" y="368" font-size="13.5" font-weight="600" fill="#1b64da">이상 징후만 JSON + 스냅샷 URL 발송</text>

  <!-- Arrow 3 -->
  <line x1="648" y1="327" x2="696" y2="327" stroke="#4e5968" stroke-width="1.6"/>
  <path d="M690 321 L699 327 L690 333" fill="none" stroke="#4e5968" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Box 5: Enterprise SAP / Digital Twin -->
  <rect x="702" y="268" width="170" height="118" rx="12" fill="#ffffff" stroke="#d1d6db" stroke-width="1.2"/>
  <text x="787" y="314" font-size="16.5" font-weight="800" fill="#191f28" text-anchor="middle">설비 관리 시스템</text>
  <text x="787" y="340" font-size="13.5" fill="#6b7684" text-anchor="middle">SAP PM 보수 알림 ·</text>
  <text x="787" y="360" font-size="13.5" fill="#6b7684" text-anchor="middle">디지털 트윈 동기화</text>
</svg>
