<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 14px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #64748b; }
      .panel-label { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.5px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; }
      .curve-label { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 800; fill: #0f172a; }
      .card-item { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 500; fill: #334155; }
    </style>
    <filter id="panel-shadow" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <pattern id="red-stripe" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#fca5a5" stroke-width="2.5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" rx="18" class="bg" stroke="#cbd5e1" stroke-width="1" />

  <!-- Header -->
  <text x="44" y="42" class="title">배차 동기화와 2대 대기시간 손실 함수 (Dispatch Loss Curve)</text>
  <text x="44" y="66" class="subtitle">즉각 배차의 라이더 대기 낭비 vs 지연 배차의 정시 픽업 동기화, 그리고 비대칭 손실 최적화</text>

  <!-- PANEL 1: TIMELINE COMPARISON (x: 44, y: 88, w: 872, h: 200) -->
  <g transform="translate(44, 88)">
    <rect width="872" height="200" class="panel" filter="url(#panel-shadow)" />
    <text x="24" y="28" class="panel-label" fill="#2563eb">PART 1. 배차 시점에 따른 현장 동기화 비교</text>

    <!-- CASE A: IMMEDIATE DISPATCH -->
    <g transform="translate(24, 46)">
      <!-- Label Tag -->
      <rect x="0" y="0" width="112" height="26" rx="5" fill="#fee2e2" />
      <text x="56" y="17" text-anchor="middle" class="badge-text" fill="#b91c1c">❌ 즉각 배차 (t=0)</text>

      <!-- Track Background Line -->
      <line x1="124" y1="13" x2="680" y2="13" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />

      <!-- Segment 1: Courier Travel (0 to 10m -> w: 90) -->
      <rect x="124" y="4" width="90" height="18" rx="4" fill="#3b82f6" />
      <text x="169" y="17" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">이동 (10분)</text>

      <!-- Segment 2: Idle Wait (10 to 38m -> w: 252) -->
      <rect x="214" y="4" width="252" height="18" rx="4" fill="url(#red-stripe)" stroke="#ef4444" stroke-width="1" />
      <text x="340" y="17" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">🚨 라이더 길바닥 대기 (28분 낭비)</text>

      <!-- Food Ready Point (at x=466) -->
      <circle cx="466" cy="13" r="6" fill="#10b981" />
      <text x="466" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">t=38분 조리완료</text>

      <!-- Result Pill -->
      <rect x="696" y="0" width="144" height="26" rx="5" fill="#fef2f2" stroke="#fecaca" />
      <text x="768" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">라이더 이탈 리스크</text>
    </g>

    <!-- Divider Line -->
    <line x1="24" y1="116" x2="848" y2="116" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- CASE B: STAGED / DELAYED DISPATCH -->
    <g transform="translate(24, 134)">
      <!-- Label Tag -->
      <rect x="0" y="0" width="112" height="26" rx="5" fill="#dcfce7" />
      <text x="56" y="17" text-anchor="middle" class="badge-text" fill="#15803d">✅ 지연 배차 (t=26)</text>

      <!-- Track Background Line -->
      <line x1="124" y1="13" x2="680" y2="13" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />

      <!-- Segment 1: Hold Window (0 to 26m -> w: 234) -->
      <rect x="124" y="4" width="234" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,3" />
      <text x="241" y="17" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748b">배차 보류 (26분 대기)</text>

      <!-- Segment 2: Call & Travel (26 to 38m -> w: 108) -->
      <rect x="358" y="4" width="108" height="18" rx="4" fill="#2563eb" />
      <text x="412" y="17" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">호출+주행 (12분)</text>

      <!-- Sync Point (at x=466) -->
      <circle cx="466" cy="13" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2" />
      <text x="466" y="36" text-anchor="middle" font-size="11" font-weight="800" fill="#047857">🎯 조리=도착 일치</text>

      <!-- Result Pill -->
      <rect x="696" y="0" width="144" height="26" rx="5" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="768" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">대기 0분 즉시 픽업</text>
    </g>
  </g>

  <!-- PANEL 2: LOSS CURVE & OPTIMIZATION (x: 44, y: 304, w: 872, h: 250) -->
  <g transform="translate(44, 304)">
    <rect width="872" height="250" class="panel" filter="url(#panel-shadow)" />
    <text x="24" y="28" class="panel-label" fill="#4f46e5">PART 2. 라이더 호출 시점별 비대칭 손실 함수 (MULTI-OBJECTIVE OPTIMIZATION)</text>

    <!-- LEFT: THE 2D GRAPH (x: 40, y: 52, w: 480, h: 180) -->
    <g transform="translate(40, 50)">
      <!-- Axes -->
      <line x1="0" y1="140" x2="470" y2="140" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="140" stroke="#94a3b8" stroke-width="1.5" />
      
      <text x="235" y="162" text-anchor="middle" class="axis-label">라이더 호출 시점 (너무 빠름 ← 최적 타이밍 t=26분 → 너무 늦음)</text>
      <text x="-10" y="-8" class="axis-label">총 손실 Loss</text>

      <!-- Curve 1: Courier Wait Loss (Red dashed, steep) -->
      <path d="M 25 15 Q 130 120, 230 134 T 450 138" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
      <text x="35" y="42" class="curve-label" fill="#dc2626">라이더 대기 손실 (가파름)</text>

      <!-- Curve 2: Food Cold Loss (Orange dashed, gentle) -->
      <path d="M 25 138 Q 190 134, 290 120 T 450 30" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
      <text x="320" y="126" class="curve-label" fill="#d97706">음식 식음 손실 (완만)</text>

      <!-- Curve 3: Total Loss (Blue solid) -->
      <path d="M 25 25 C 95 115, 175 110, 235 82 C 295 60, 375 48, 455 38" fill="none" stroke="#2563eb" stroke-width="3" />
      <text x="400" y="24" font-size="11" font-weight="800" fill="#2563eb">Total Loss</text>

      <!-- Optimal Sweet Spot Guide at x=235 -->
      <line x1="235" y1="0" x2="235" y2="140" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
      <circle cx="235" cy="82" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2" />

      <!-- Optimal Sweet Spot Pill (Placed neatly at the top of the guide) -->
      <rect x="150" y="-12" width="170" height="26" rx="5" fill="#10b981" />
      <text x="235" y="5" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">최적 배차점 (t=26분)</text>
    </g>

    <!-- RIGHT: DECISION MATRIX CARD (x: 550, y: 46, w: 298, h: 184) -->
    <g transform="translate(550, 44)">
      <rect width="298" height="186" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
      
      <text x="18" y="24" class="card-title">다목적 손실 함수 공식</text>
      
      <!-- Formula Box -->
      <rect x="16" y="34" width="266" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="149" y="56" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#2563eb">Loss = α·T_wait + β·T_cold</text>

      <!-- Separate Bullet Lines (NO <br/>!) -->
      <text x="18" y="90" class="card-item" font-weight="700" fill="#dc2626">• α (라이더 대기 가중치): 가파름</text>
      <text x="28" y="106" font-size="11" fill="#64748b">→ 5분 초과 대기 시 배차 거부 및 이탈</text>

      <text x="18" y="128" class="card-item" font-weight="700" fill="#d97706">• β (음식 식음 가중치): 완만함</text>
      <text x="28" y="144" font-size="11" fill="#64748b">→ 보온백으로 3~5분 완충 가능</text>

      <rect x="16" y="156" width="266" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="149" y="171" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">💡 배차 지터 감안해 살짝 일찍 호출</text>
    </g>
  </g>
</svg>