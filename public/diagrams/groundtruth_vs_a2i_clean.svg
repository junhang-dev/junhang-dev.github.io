<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FAF6F0"/>
  
  <!-- Main Title -->
  <text x="640" y="68" text-anchor="middle" font-size="36" font-weight="800" fill="#232B2E" letter-spacing="-0.5">Human-in-the-Loop: Ground Truth vs Amazon A2I</text>
  
  <!-- Center Divider -->
  <line x1="640" y1="115" x2="640" y2="670" stroke="#DFD8CE" stroke-width="3" stroke-linecap="round"/>

  <!-- ================= LEFT SIDE: SAGEMAKER GROUND TRUTH ================= -->
  <text x="320" y="132" text-anchor="middle" font-size="28" font-weight="800" fill="#1E2629">SageMaker Ground Truth</text>
  <text x="320" y="168" text-anchor="middle" font-size="22" font-weight="600" fill="#4A5559">(Before Training: Dataset Labeling)</text>

  <!-- Step 1: Raw Unlabeled S3 Bucket -->
  <g transform="translate(55, 235)">
    <path d="M15,35 L85,35 L75,125 C75,132 25,132 25,125 Z" fill="#D5ECE4" stroke="#2C3539" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="50" cy="35" rx="35" ry="12" fill="#E9F6F1" stroke="#2C3539" stroke-width="3"/>
    <!-- Unlabeled Document Icons inside bucket -->
    <rect x="32" y="10" width="28" height="32" rx="3" fill="#FFFFFF" stroke="#2C3539" stroke-width="2.5"/>
    <text x="46" y="31" text-anchor="middle" font-size="16" font-weight="800" fill="#D9735B">?</text>
    <text x="50" y="88" text-anchor="middle" font-size="22" font-weight="800" fill="#2C3539">S3</text>
    <text x="50" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#374247">Raw Unlabeled</text>
    <text x="50" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#374247">Data (100K)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M160,300 L205,300" stroke="#2C3539" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2: Active Learning Split Box -->
  <g transform="translate(215, 205)">
    <rect x="0" y="0" width="210" height="190" rx="16" fill="#FFFFFF" stroke="#2C3539" stroke-width="3"/>
    <rect x="0" y="0" width="210" height="42" rx="16" fill="#DCEAF7" stroke="#2C3539" stroke-width="3"/>
    <text x="105" y="27" text-anchor="middle" font-size="16" font-weight="800" fill="#232B2E">Active Learning Model</text>

    <!-- Easy 70%: Auto Robot -->
    <rect x="16" y="56" width="178" height="54" rx="10" fill="#D5ECE4" stroke="#2C3539" stroke-width="2.5"/>
    <circle cx="44" cy="83" r="16" fill="#FFFFFF" stroke="#2C3539" stroke-width="2.5"/>
    <text x="44" y="89" text-anchor="middle" font-size="16">🤖</text>
    <text x="122" y="79" text-anchor="middle" font-size="14" font-weight="800" fill="#1E2629">Easy 70%: Auto-Label</text>
    <text x="122" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#3B5249">(High Confidence)</text>

    <!-- Hard 30%: Human Worker -->
    <rect x="16" y="122" width="178" height="54" rx="10" fill="#FBE4D8" stroke="#2C3539" stroke-width="2.5"/>
    <circle cx="44" cy="149" r="16" fill="#FFFFFF" stroke="#2C3539" stroke-width="2.5"/>
    <text x="44" y="155" text-anchor="middle" font-size="16">👩‍💻</text>
    <text x="122" y="145" text-anchor="middle" font-size="14" font-weight="800" fill="#1E2629">Hard 30%: Human</text>
    <text x="122" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#6E4436">(Uncertain Samples)</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M435,300 L480,300" stroke="#2C3539" stroke-width="3" fill="none"/>
  <polygon points="485,300 475,293 475,307" fill="#2C3539"/>

  <!-- Step 3: Labeled Training Dataset -->
  <g transform="translate(492, 235)">
    <rect x="0" y="10" width="105" height="115" rx="12" fill="#D5ECE4" stroke="#2C3539" stroke-width="3"/>
    <rect x="16" y="28" width="73" height="22" rx="5" fill="#FFFFFF" stroke="#2C3539" stroke-width="2"/>
    <text x="52" y="44" text-anchor="middle" font-size="13" font-weight="800" fill="#2B6B55">✓ Cat</text>
    <rect x="16" y="58" width="73" height="22" rx="5" fill="#FFFFFF" stroke="#2C3539" stroke-width="2"/>
    <text x="52" y="74" text-anchor="middle" font-size="13" font-weight="800" fill="#2B6B55">✓ Dog</text>
    <rect x="16" y="88" width="73" height="22" rx="5" fill="#FFFFFF" stroke="#2C3539" stroke-width="2"/>
    <text x="52" y="104" text-anchor="middle" font-size="13" font-weight="800" fill="#2B6B55">✓ Car</text>
    <text x="52" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#232B2E">Training Dataset</text>
    <text x="52" y="171" text-anchor="middle" font-size="14" font-weight="600" fill="#4A5559">(Ready to Train!)</text>
  </g>

  <!-- Left Badges -->
  <g transform="translate(55, 455)">
    <rect x="0" y="0" width="252" height="72" rx="36" fill="#D5ECE4" stroke="#2C3539" stroke-width="2.8"/>
    <text x="126" y="32" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Phase: BEFORE Training</text>
    <text x="126" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#3B5249">(Builds Training Datasets)</text>

    <rect x="272" y="0" width="252" height="72" rx="36" fill="#D5ECE4" stroke="#2C3539" stroke-width="2.8"/>
    <text x="398" y="32" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Active Learning Engine</text>
    <text x="398" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#3B5249">(Auto-Labels Easy 70%)</text>

    <rect x="0" y="92" width="252" height="72" rx="36" fill="#D5ECE4" stroke="#2C3539" stroke-width="2.8"/>
    <text x="126" y="124" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Saves Up to 70% Cost</text>
    <text x="126" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#3B5249">&amp; Labeling Time</text>

    <rect x="272" y="92" width="252" height="72" rx="36" fill="#D5ECE4" stroke="#2C3539" stroke-width="2.8"/>
    <text x="398" y="124" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Workforce Options</text>
    <text x="398" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#3B5249">(MTurk / Private / Vendor)</text>
  </g>


  <!-- ================= RIGHT SIDE: AMAZON A2I (AUGMENTED AI) ================= -->
  <text x="960" y="132" text-anchor="middle" font-size="28" font-weight="800" fill="#1E2629">Amazon A2I (Augmented AI)</text>
  <text x="960" y="168" text-anchor="middle" font-size="22" font-weight="600" fill="#4A5559">(During Inference: Low-Confidence Audit)</text>

  <!-- Step 1: Live Production Model Inference -->
  <g transform="translate(685, 225)">
    <rect x="0" y="10" width="135" height="120" rx="14" fill="#DCEAF7" stroke="#2C3539" stroke-width="3"/>
    <text x="67" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#1E2629">Live AI Model</text>
    <text x="67" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#3A5068">(Textract / Custom)</text>
    <rect x="18" y="74" width="99" height="40" rx="8" fill="#FFFFFF" stroke="#2C3539" stroke-width="2"/>
    <text x="67" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#232B2E">📄 Live Input</text>
    <text x="67" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#374247">Production</text>
    <text x="67" y="177" text-anchor="middle" font-size="15" font-weight="700" fill="#374247">Inference</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M828,295 L865,295" stroke="#2C3539" stroke-width="3" fill="none"/>
  <polygon points="870,295 860,288 860,302" fill="#2C3539"/>

  <!-- Step 2: Confidence Score Check (< 80%!) -->
  <g transform="translate(875, 215)">
    <rect x="0" y="0" width="175" height="165" rx="16" fill="#F9E0DB" stroke="#2C3539" stroke-width="3"/>
    <text x="87" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#7D2918">⚠️ Low Confidence!</text>
    <rect x="20" y="48" width="135" height="52" rx="10" fill="#FFFFFF" stroke="#2C3539" stroke-width="2.5"/>
    <text x="87" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#B8331A">Score: 62%</text>
    <text x="87" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="#5C4038">(Threshold &lt; 80%)</text>
    <text x="87" y="128" text-anchor="middle" font-size="14" font-weight="800" fill="#232B2E">Triggers A2I</text>
    <text x="87" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#4A5559">Human Review Loop</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M1058,295 L1095,295" stroke="#2C3539" stroke-width="3" fill="none"/>
  <polygon points="1100,295 1090,288 1090,302" fill="#2C3539"/>

  <!-- Step 3: Human Reviewer Audits Live Result -->
  <g transform="translate(1105, 225)">
    <rect x="0" y="10" width="125" height="120" rx="14" fill="#DCEAF7" stroke="#2C3539" stroke-width="3"/>
    <circle cx="62" cy="52" r="24" fill="#FFFFFF" stroke="#2C3539" stroke-width="2.5"/>
    <text x="62" y="61" text-anchor="middle" font-size="24">🕵️‍♂️</text>
    <rect x="15" y="86" width="95" height="28" rx="6" fill="#D5ECE4" stroke="#2C3539" stroke-width="2"/>
    <text x="62" y="105" text-anchor="middle" font-size="13" font-weight="800" fill="#1E4D3B">✓ Verified!</text>
    <text x="62" y="158" text-anchor="middle" font-size="15" font-weight="800" fill="#232B2E">Human Auditor</text>
    <text x="62" y="177" text-anchor="middle" font-size="14" font-weight="600" fill="#4A5559">(Fixes Prediction)</text>
  </g>

  <!-- Right Badges -->
  <g transform="translate(695, 455)">
    <rect x="0" y="0" width="252" height="72" rx="36" fill="#DCEAF7" stroke="#2C3539" stroke-width="2.8"/>
    <text x="126" y="32" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Phase: DURING Inference</text>
    <text x="126" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#2E4A66">(Live Production Models)</text>

    <rect x="272" y="0" width="252" height="72" rx="36" fill="#DCEAF7" stroke="#2C3539" stroke-width="2.8"/>
    <text x="398" y="32" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Confidence Threshold</text>
    <text x="398" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#2E4A66">(Routes Score &lt; X% to Human)</text>

    <rect x="0" y="92" width="252" height="72" rx="36" fill="#DCEAF7" stroke="#2C3539" stroke-width="2.8"/>
    <text x="126" y="124" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Audits Uncertain Cases</text>
    <text x="126" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#2E4A66">(Real-Time Quality Guard)</text>

    <rect x="272" y="92" width="252" height="72" rx="36" fill="#DCEAF7" stroke="#2C3539" stroke-width="2.8"/>
    <text x="398" y="124" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Native Built-in Hooks</text>
    <text x="398" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#2E4A66">(Textract, Rekognition, Custom)</text>
  </g>
</svg>