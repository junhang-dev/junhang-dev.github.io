<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background:#FAF8F5; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0284C7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#EA580C"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0D9488"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="22" width="1140" height="76" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="30" y="22" width="10" height="76" rx="5" fill="#EA580C"/>
  <text x="60" y="54" font-size="22" font-weight="800" fill="#0F172A">🤖 엔터프라이즈 Physical AI (로봇·드론) 5단계 Edge-to-Cloud 선순환 청사진</text>
  <text x="60" y="79" font-size="13.5" font-weight="500" fill="#475569">"로봇/드론 하드웨어 도입이 끝이 아니다 — 현장 자율 인지(Edge)부터 클라우드 재학습·기간계(SAP) 작업지시까지 연결된 디지털 신경망"</text>
  <rect x="975" y="40" width="175" height="38" rx="19" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="1062" y="64" font-size="12.5" font-weight="800" fill="#C2410C" text-anchor="middle">FDE Architecture Map</text>

  <!-- ==================== LAYER 1: PHYSICAL EDGE (LEFT) ==================== -->
  <rect x="30" y="118" width="340" height="470" rx="16" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="48" y="134" width="304" height="36" rx="8" fill="#DCFCE7"/>
  <text x="200" y="157" font-size="14.5" font-weight="800" fill="#166534" text-anchor="middle">① PHYSICAL EDGE (현장 초저지연 자율 추론)</text>

  <!-- Quadruped Robot & Drone Visual Card -->
  <rect x="48" y="182" width="304" height="175" rx="12" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <!-- Drone Icon -->
  <g transform="translate(68, 198)">
    <rect x="0" y="0" width="120" height="90" rx="10" fill="#E0F2FE" stroke="#7DD3FC"/>
    <line x1="25" y1="32" x2="95" y2="32" stroke="#0284C7" stroke-width="3"/>
    <circle cx="25" cy="32" r="10" fill="#BAE6FD" stroke="#0284C7" stroke-width="2"/>
    <circle cx="95" cy="32" r="10" fill="#BAE6FD" stroke="#0284C7" stroke-width="2"/>
    <rect x="44" y="24" width="32" height="18" rx="5" fill="#0284C7"/>
    <circle cx="60" cy="48" r="6" fill="#0F172A"/>
    <path d="M52,54 L40,76 L80,76 L68,54 Z" fill="#FDE047" opacity="0.45"/>
    <text x="60" y="84" font-size="10.5" font-weight="700" fill="#0369A1" text-anchor="middle">자율비행 드론 (비전/열화상)</text>
  </g>
  <!-- Robot Dog Icon -->
  <g transform="translate(208, 198)">
    <rect x="0" y="0" width="126" height="90" rx="10" fill="#FEF3C7" stroke="#FDE68A"/>
    <rect x="34" y="28" width="56" height="22" rx="6" fill="#D97706"/>
    <rect x="78" y="18" width="22" height="16" rx="4" fill="#B45309"/>
    <circle cx="94" cy="25" r="3" fill="#FEF08A"/>
    <line x1="42" y1="50" x2="36" y2="70" stroke="#92400E" stroke-width="4" stroke-linecap="round"/>
    <line x1="54" y1="50" x2="52" y2="70" stroke="#92400E" stroke-width="4" stroke-linecap="round"/>
    <line x1="74" y1="50" x2="72" y2="70" stroke="#92400E" stroke-width="4" stroke-linecap="round"/>
    <line x1="84" y1="50" x2="90" y2="70" stroke="#92400E" stroke-width="4" stroke-linecap="round"/>
    <text x="63" y="84" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">4족 보행 로봇 (LiDAR/음향)</text>
  </g>
  <text x="200" y="315" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">⚡ 왜 클라우드로 바로 못 보내나? (Trade-off)</text>
  <text x="200" y="334" font-size="11.2" fill="#475569" text-anchor="middle">배관/탱크 음영지역 통신 끊김 + 장애물 회피는 10ms 이내 필수!</text>
  <text x="200" y="350" font-size="11.2" fill="#15803D" font-weight="700" text-anchor="middle">➔ 1차 판단(장애물 회피·이상 징후 크롭)은 무조건 온디바이스 Edge에서!</text>

  <!-- Edge Tech Stack Box -->
  <rect x="48" y="368" width="304" height="204" rx="12" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="64" y="392" font-size="13" font-weight="800" fill="#166534">🛠️ Edge AI 탑재 스택 (우리가 배운 개념 확장)</text>
  <text x="64" y="416" font-size="11.8" fill="#1E293B">• <tspan font-weight="700" fill="#0369A1">SageMaker Neo / TensorRT:</tspan> 무거운 비전·VLA 모델을</text>
  <text x="74" y="433" font-size="11.5" fill="#475569">Jetson Orin 칩셋 맞춤형 경량화·양자화(INT8/FP16) 컴파일</text>
  <text x="64" y="456" font-size="11.8" fill="#1E293B">• <tspan font-weight="700" fill="#0369A1">AWS IoT Greengrass V2:</tspan> 로봇 50대에 새 모델 무선(OTA)</text>
  <text x="74" y="473" font-size="11.5" fill="#475569">배포 및 로컬 Lambda/Docker 컨테이너 런타임 관리</text>
  <text x="64" y="496" font-size="11.8" fill="#1E293B">• <tspan font-weight="700" fill="#B45309">Smart Edge Filtering (Pair #19 Recall):</tspan></text>
  <text x="74" y="513" font-size="11.5" fill="#475569">4K 영상 100%를 올리지 않고, 임계값(Threshold)을 낮춰</text>
  <text x="74" y="530" font-size="11.5" fill="#475569"><tspan font-weight="700" fill="#DC2626">결함 의심 장면 + 센서 이상치만 우선 태깅</tspan> (통신비 90% 절감)</text>
  <rect x="64" y="540" width="272" height="22" rx="5" fill="#DCFCE7"/>
  <text x="200" y="555" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">핵심 지표: 온디바이스 추론 &lt; 20ms, Recall(재현율) 최우선</text>

  <!-- ==================== LAYER 2: DUAL INGESTION HIGHWAY (MIDDLE TOP) ==================== -->
  <rect x="405" y="118" width="380" height="215" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="423" y="134" width="344" height="34" rx="8" fill="#DBEAFE"/>
  <text x="595" y="156" font-size="14" font-weight="800" fill="#1E40AF" text-anchor="middle">② DUAL DATA HIGHWAY (2-Track 수집 파이프라인)</text>

  <!-- Hot Path -->
  <rect x="423" y="178" width="344" height="68" rx="10" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="438" y="199" font-size="12.5" font-weight="800" fill="#DC2626">🔥 Track A. 실시간 관제·긴급 알람 (Hot Path)</text>
  <text x="438" y="218" font-size="11.5" fill="#334155">• 로봇 위치·배터리·가스누출 수치 ➔ <tspan font-weight="700" fill="#0284C7">IoT Core + Kinesis (Pair #24)</tspan></text>
  <text x="438" y="235" font-size="11.5" fill="#334155">• 최근 5분 센서 진동 상태 ➔ <tspan font-weight="700" fill="#0284C7">Online Feature Store (Pair #6)</tspan></text>

  <!-- Cold/Warm Path -->
  <rect x="423" y="254" width="344" height="68" rx="10" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="438" y="275" font-size="12.5" font-weight="800" fill="#0369A1">🧊 Track B. 대용량 영상·3D 포인트클라우드 (Warm/Cold Path)</text>
  <text x="438" y="294" font-size="11.5" fill="#334155">• 도킹 스테이션 복귀 후 대용량 영상/ROS Bag ➔ <tspan font-weight="700" fill="#0284C7">Amazon S3</tspan></text>
  <text x="438" y="311" font-size="11.5" fill="#334155">• 500MB 고해상도 3D 정밀 판독 ➔ <tspan font-weight="700" fill="#7C3AED">Async Endpoint (Pair #1)</tspan></text>

  <!-- ==================== LAYER 3: HUMAN-IN-THE-LOOP & FLYWHEEL (MIDDLE BOTTOM) ==================== -->
  <rect x="405" y="353" width="380" height="235" rx="16" fill="#FDF4FF" stroke="#E879F9" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="423" y="369" width="344" height="34" rx="8" fill="#FAE8FF"/>
  <text x="595" y="391" font-size="14" font-weight="800" fill="#86198F" text-anchor="middle">③ DATA FLYWHEEL &amp; SIM-TO-REAL (진화 엔진)</text>

  <rect x="423" y="412" width="344" height="162" rx="10" fill="#FFFFFF" stroke="#F0ABFC" stroke-width="1.5"/>
  <text x="438" y="434" font-size="12.2" font-weight="800" fill="#86198F">🔄 로봇이 현장에서 똑똑해지는 3단계 루프</text>
  <text x="438" y="456" font-size="11.5" fill="#1E293B">1. <tspan font-weight="700" fill="#9333EA">Amazon A2I (Pair #16):</tspan> 로봇 판독 확신도(Confidence)가</text>
  <text x="450" y="473" font-size="11.2" fill="#475569">70% 미만인 애매한 부식 사진만 설비 전문 엔지니어에게 검수 요청</text>
  <text x="438" y="495" font-size="11.5" fill="#1E293B">2. <tspan font-weight="700" fill="#9333EA">Ground Truth + FastFile (Pair #15):</tspan> 검수된 데이터를</text>
  <text x="450" y="512" font-size="11.2" fill="#475569">S3에 모아 POSIX 스트리밍으로 비전/VLA 모델 야간 재학습</text>
  <text x="438" y="534" font-size="11.5" fill="#1E293B">3. <tspan font-weight="700" fill="#9333EA">Digital Twin / Sim-to-Real &amp; Shadow (Pair #17):</tspan></text>
  <text x="450" y="551" font-size="11.2" fill="#475569">화재·폭발 등 희귀 사고는 가상 시뮬레이터(Isaac Sim)로 합성 학습 후</text>
  <text x="450" y="566" font-size="11.2" fill="#475569">실제 로봇에 <tspan font-weight="700" fill="#DC2626">Shadow 모드</tspan>로 먼저 탑재해 안전성 100% 검증!</text>

  <!-- ==================== LAYER 4: AGENTIC BRAIN & LEGACY ERP (RIGHT) ==================== -->
  <rect x="820" y="118" width="350" height="470" rx="16" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="838" y="134" width="314" height="36" rx="8" fill="#FEF3C7"/>
  <text x="995" y="157" font-size="14" font-weight="800" fill="#92400E" text-anchor="middle">④ AGENTIC BRAIN &amp; 기간계(SAP/ERP) 실행</text>

  <!-- Brain Flow Card -->
  <rect x="838" y="182" width="314" height="190" rx="12" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="854" y="205" font-size="13" font-weight="800" fill="#B45309">🧠 "발견"을 "보수 작업"으로 바꾸는 두뇌</text>
  <text x="854" y="227" font-size="11.5" fill="#334155">로봇이 "B-302 배관 보온재 손상 및 120°C 열점 발견"</text>
  <text x="854" y="244" font-size="11.5" fill="#334155">이벤트를 올리면 클라우드 에이전트가 즉시 가동됩니다:</text>

  <rect x="854" y="256" width="282" height="50" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="866" y="275" font-size="11.5" font-weight="700" fill="#1E40AF">📚 Hybrid RAG 지식 검색 (Pair #8, #11)</text>
  <text x="866" y="294" font-size="11" fill="#475569">해당 배관 과거 정비 이력 + 설계 도면 + 안전 작업 절차서 검색</text>

  <rect x="854" y="314" width="282" height="48" rx="8" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="866" y="333" font-size="11.5" font-weight="700" fill="#C2410C">🤖 Bedrock Agents / LangGraph (Pair #10)</text>
  <text x="866" y="351" font-size="11" fill="#475569">위험도 산출 ➔ 보수 자재 재고 확인 ➔ 작업요청서 초안 생성</text>

  <!-- Legacy System Integration Card -->
  <rect x="838" y="384" width="314" height="188" rx="12" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="854" y="408" font-size="13" font-weight="800" fill="#0F172A">🏢 사내 기간계 시스템 연동 &amp; 안전 가드레일</text>
  <text x="854" y="431" font-size="11.5" fill="#1E293B">• <tspan font-weight="700" fill="#0284C7">SAP PM / 설비관리 ERP 연동:</tspan> OpenAPI + Lambda</text>
  <text x="866" y="448" font-size="11.2" fill="#475569">Action Group으로 보수 통지서(Notification) 자동 기안</text>
  <text x="854" y="471" font-size="11.5" fill="#1E293B">• <tspan font-weight="700" fill="#0284C7">3D 디지털 트윈 관제 대시보드:</tspan> 플랜트 3D 맵 위에</text>
  <text x="866" y="488" font-size="11.2" fill="#475569">결함 위치 핀(Pin) + 원본 사진 Citation 1:1 매핑</text>
  <text x="854" y="511" font-size="11.5" fill="#1E293B">• <tspan font-weight="700" fill="#DC2626">Human Approval Guardrail:</tspan> 밸브 차단이나 로봇 재출동</text>
  <text x="866" y="528" font-size="11.2" fill="#475569">명령은 반드시 운전원 승인 후 실행 (Return of Control)</text>
  <rect x="854" y="538" width="282" height="22" rx="5" fill="#FEF3C7"/>
  <text x="995" y="553" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">비즈니스 가치: "사람이 위험 구역에 안 들어가도 정비 품의까지 완료"</text>

  <!-- ==================== CONNECTING ARROWS ==================== -->
  <!-- Edge to Highway -->
  <line x1="370" y1="220" x2="401" y2="220" stroke="#0284C7" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="370" y1="290" x2="401" y2="290" stroke="#0284C7" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <!-- Highway to Brain -->
  <line x1="785" y1="220" x2="816" y2="220" stroke="#EA580C" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <line x1="785" y1="290" x2="816" y2="290" stroke="#EA580C" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <!-- Highway to Flywheel -->
  <line x1="595" y1="333" x2="595" y2="350" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <!-- Flywheel back to Edge (OTA Deployment) -->
  <path d="M405,490 L374,490" stroke="#0D9488" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="389" y="480" font-size="10" font-weight="800" fill="#0D9488" text-anchor="middle">OTA 배포</text>

  <!-- ==================== BOTTOM SUMMARY BAR: FDE PITCH ==================== -->
  <rect x="30" y="606" width="1140" height="130" rx="14" fill="#1E293B" filter="url(#softShadow)"/>
  <text x="58" y="636" font-size="15.5" font-weight="800" fill="#F8FAFC">💡 회사 임원진·현업 발표용 핵심 메시지 (준행님만의 FDE 관점 3대 포인트)</text>
  
  <rect x="55" y="650" width="350" height="68" rx="10" fill="#334155"/>
  <text x="70" y="672" font-size="12.5" font-weight="800" fill="#38BDF8">1. "로봇은 움직이는 엣지 서버(Edge Node)다"</text>
  <text x="70" y="692" font-size="11.2" fill="#E2E8F0">통신 음영 지역에서도 즉시 멈추고 피하는 건 Edge AI(Greengrass),</text>
  <text x="70" y="708" font-size="11.2" fill="#E2E8F0">수만 장 중 진짜 결함을 정밀 해부하는 건 Cloud(Async/A2I)로 역할 분담!</text>

  <rect x="425" y="650" width="350" height="68" rx="10" fill="#334155"/>
  <text x="440" y="672" font-size="12.5" font-weight="800" fill="#FBBF24">2. "영상이 쌓이는 게 아니라 작업지시서가 나와야 한다"</text>
  <text x="440" y="692" font-size="11.2" fill="#E2E8F0">드론/로봇이 찍은 사진만 폴더에 쌓이면 현업은 안 봅니다. 기존에 만든</text>
  <text x="440" y="708" font-size="11.2" fill="#E2E8F0">설비 RAG 에이전트 및 SAP 작업지시 API와 1:1로 이어져야 진짜 DX!</text>

  <rect x="795" y="650" width="350" height="68" rx="10" fill="#334155"/>
  <text x="810" y="672" font-size="12.5" font-weight="800" fill="#4ADE80">3. "안전이 생명인 정유공장은 Shadow + A2I가 필수다"</text>
  <text x="810" y="692" font-size="11.2" fill="#E2E8F0">새로 학습한 로봇/드론 AI 모델을 현장에 바로 풀지 않고, Shadow 모드로</text>
  <text x="810" y="708" font-size="11.2" fill="#E2E8F0">검증한 뒤 애매한 판독은 사람(A2I)이 확증하는 플라이휠이 핵심 자산!</text>
</svg>
