<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FAF6F0"/>
  
  <!-- Main Title -->
  <text x="640" y="65" text-anchor="middle" font-size="35" font-weight="800" fill="#232B2E" letter-spacing="-0.5">SageMaker Built-in Algorithms: Data Type Decision Map</text>
  
  <!-- Center Dividers (4-Quadrant Grid) -->
  <line x1="640" y1="100" x2="640" y2="680" stroke="#DFD8CE" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="395" x2="1225" y2="395" stroke="#DFD8CE" stroke-width="3" stroke-linecap="round"/>

  <!-- ================= QUADRANT 1 (TOP-LEFT): COMPUTER VISION ================= -->
  <g transform="translate(55, 105)">
    <rect x="0" y="0" width="555" height="265" rx="18" fill="#DCEAF7" stroke="#2C3539" stroke-width="3"/>
    <text x="277" y="38" text-anchor="middle" font-size="23" font-weight="800" fill="#1E2629">📸 1. Image / Drone Photo (Computer Vision)</text>
    
    <rect x="24" y="56" width="240" height="125" rx="12" fill="#FFFFFF" stroke="#2C3539" stroke-width="2.5"/>
    <text x="144" y="88" text-anchor="middle" font-size="16" font-weight="800" fill="#1E2629">Image Classification &amp;</text>
    <text x="144" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#1E2629">Object Detection</text>
    <text x="144" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#2E4A66">(ResNet / RetinaNet / SSD / YOLO)</text>
    <text x="144" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5559">드론 균열 탐지 / 의료 영상 판독</text>

    <rect x="284" y="56" width="247" height="125" rx="12" fill="#F9E0DB" stroke="#2C3539" stroke-width="2.5"/>
    <text x="407" y="88" text-anchor="middle" font-size="16" font-weight="800" fill="#8C2816">🔥 Imbalance Fix:</text>
    <text x="407" y="114" text-anchor="middle" font-size="18" font-weight="800" fill="#B8331A">Focal Loss</text>
    <text x="407" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#5C4038">99% 정상 배경 가중치는 줄이고</text>
    <text x="407" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#5C4038">1% 어려운 균열 객체에 집중!</text>

    <rect x="24" y="198" width="507" height="46" rx="23" fill="#FFFFFF" stroke="#2C3539" stroke-width="2"/>
    <text x="277" y="227" text-anchor="middle" font-size="15" font-weight="800" fill="#1E2629">💡 Semantic Segmentation = 픽셀(Pixel) 단위 정밀 분할 (도로/장기 경계)</text>
  </g>

  <!-- ================= QUADRANT 2 (TOP-RIGHT): TABULAR DATA ================= -->
  <g transform="translate(670, 105)">
    <rect x="0" y="0" width="555" height="265" rx="18" fill="#D5ECE4" stroke="#2C3539" stroke-width="3"/>
    <text x="277" y="38" text-anchor="middle" font-size="23" font-weight="800" fill="#1E2629">📊 2. Tabular / Structured Data (정형 표 데이터)</text>

    <rect x="24" y="56" width="240" height="125" rx="12" fill="#FFFFFF" stroke="#2C3539" stroke-width="2.5"/>
    <text x="144" y="88" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">XGBoost / LightGBM</text>
    <text x="144" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#2B6B55">(Gradient Boosted Trees)</text>
    <text x="144" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5559">고객 이탈 예측 / 대출 심사 /</text>
    <text x="144" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5559">센서 수치 기반 고장 분류</text>

    <rect x="284" y="56" width="247" height="125" rx="12" fill="#FBE4D8" stroke="#2C3539" stroke-width="2.5"/>
    <text x="407" y="88" text-anchor="middle" font-size="16" font-weight="800" fill="#6E4436">⚖️ Imbalance Fix:</text>
    <text x="407" y="114" text-anchor="middle" font-size="17" font-weight="800" fill="#8C2816">scale_pos_weight</text>
    <text x="407" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#5C4038">정형 표 데이터에서 소수(양성)</text>
    <text x="407" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#5C4038">클래스 오분류 페널티 증폭!</text>

    <rect x="24" y="198" width="507" height="46" rx="23" fill="#FFFFFF" stroke="#2C3539" stroke-width="2"/>
    <text x="277" y="227" text-anchor="middle" font-size="15" font-weight="800" fill="#1E2629">💡 CatBoost = 범주형(Categorical) 변수가 많을 때 원핫인코딩 없이 직행!</text>
  </g>

  <!-- ================= QUADRANT 3 (BOTTOM-LEFT): TIME-SERIES FORECASTING ================= -->
  <g transform="translate(55, 415)">
    <rect x="0" y="0" width="555" height="265" rx="18" fill="#FBE4D8" stroke="#2C3539" stroke-width="3"/>
    <text x="277" y="38" text-anchor="middle" font-size="23" font-weight="800" fill="#1E2629">📈 3. Time-Series Forecasting (시계열 수요 예측)</text>

    <rect x="24" y="56" width="240" height="125" rx="12" fill="#FFFFFF" stroke="#2C3539" stroke-width="2.5"/>
    <text x="144" y="92" text-anchor="middle" font-size="20" font-weight="800" fill="#8C2816">Amazon DeepAR</text>
    <text x="144" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#6E4436">(Autoregressive RNN)</text>
    <text x="144" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5559">수백 개 매장/상품 시계열을</text>
    <text x="144" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5559">단 하나의 모델로 동시 학습!</text>

    <rect x="284" y="56" width="247" height="125" rx="12" fill="#D5ECE4" stroke="#2C3539" stroke-width="2.5"/>
    <text x="407" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#1E4D3B">🌟 Exam Killer Clue:</text>
    <text x="407" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#1E2629">Cold-Start Forecasting</text>
    <text x="407" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#2B6B55">과거 이력이 거의 없는 '신상품'도</text>
    <text x="407" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#2B6B55">유사 상품 패턴을 빌려와 예측 가능!</text>

    <rect x="24" y="198" width="507" height="46" rx="23" fill="#FFFFFF" stroke="#2C3539" stroke-width="2"/>
    <text x="277" y="227" text-anchor="middle" font-size="15" font-weight="800" fill="#1E2629">💡 분위수 예측 (Quantile Forecast: P10, P50, P90) 기본 지원</text>
  </g>

  <!-- ================= QUADRANT 4 (BOTTOM-RIGHT): ANOMALY & NLP ================= -->
  <g transform="translate(670, 415)">
    <rect x="0" y="0" width="555" height="265" rx="18" fill="#EAE6DF" stroke="#2C3539" stroke-width="3"/>
    <text x="277" y="38" text-anchor="middle" font-size="23" font-weight="800" fill="#1E2629">🚨 4. Unsupervised Anomaly &amp; Text (이상 탐지/NLP)</text>

    <rect x="24" y="56" width="245" height="125" rx="12" fill="#FFFFFF" stroke="#2C3539" stroke-width="2.5"/>
    <text x="146" y="86" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Random Cut Forest</text>
    <text x="146" y="108" text-anchor="middle" font-size="14" font-weight="800" fill="#8C2816">(RCF - 비지도 이상 탐지)</text>
    <text x="146" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#4A5559">라벨 없는 스트리밍 센서/로그에서</text>
    <text x="146" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#4A5559">Anomaly Score로 이상치 색출!</text>

    <rect x="284" y="56" width="247" height="125" rx="12" fill="#DCEAF7" stroke="#2C3539" stroke-width="2.5"/>
    <text x="407" y="86" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">BlazingText &amp; NTM</text>
    <text x="407" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#2E4A66">• BlazingText: Word2Vec / 텍스트 분류</text>
    <text x="407" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#2E4A66">• NTM / LDA: 비지도 토픽 모델링</text>
    <text x="407" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5559">(문서 군집의 핵심 주제어 추출)</text>

    <rect x="24" y="198" width="507" height="46" rx="23" fill="#FFFFFF" stroke="#2C3539" stroke-width="2"/>
    <text x="277" y="227" text-anchor="middle" font-size="15" font-weight="800" fill="#1E2629">💡 IP Insights = 비지도 학습으로 의심스러운 IP 로그인/계정 탈취 탐지</text>
  </g>
</svg>