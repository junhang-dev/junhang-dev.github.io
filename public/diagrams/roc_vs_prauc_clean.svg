<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FAF6F0"/>
  
  <!-- Main Title -->
  <text x="640" y="68" text-anchor="middle" font-size="36" font-weight="800" fill="#232B2E" letter-spacing="-0.5">Imbalanced Evaluation: ROC-AUC vs PR-AUC</text>
  
  <!-- Center Divider -->
  <line x1="640" y1="115" x2="640" y2="670" stroke="#DFD8CE" stroke-width="3" stroke-linecap="round"/>

  <!-- ================= LEFT SIDE: ROC-AUC ================= -->
  <text x="320" y="132" text-anchor="middle" font-size="28" font-weight="800" fill="#1E2629">ROC-AUC</text>
  <text x="320" y="168" text-anchor="middle" font-size="22" font-weight="600" fill="#4A5559">(Balanced Classes: 50% Cats vs 50% Dogs)</text>

  <!-- Balanced Scale Visual -->
  <g transform="translate(65, 210)">
    <rect x="0" y="0" width="230" height="190" rx="16" fill="#DCEAF7" stroke="#2C3539" stroke-width="3"/>
    <text x="115" y="36" text-anchor="middle" font-size="16" font-weight="800" fill="#1E2629">⚖️ Balanced Dataset</text>
    
    <!-- Two equal bars -->
    <rect x="35" y="60" width="65" height="90" rx="8" fill="#D5ECE4" stroke="#2C3539" stroke-width="2.5"/>
    <text x="67" y="105" text-anchor="middle" font-size="16" font-weight="800" fill="#1E2629">50%</text>
    <text x="67" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#2B6B55">Positive</text>

    <rect x="130" y="60" width="65" height="90" rx="8" fill="#FFFFFF" stroke="#2C3539" stroke-width="2.5"/>
    <text x="162" y="105" text-anchor="middle" font-size="16" font-weight="800" fill="#1E2629">50%</text>
    <text x="162" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#4A5559">Negative</text>

    <text x="115" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#2E4A66">True Negatives (TN) Included</text>
  </g>

  <!-- Trap Box on Imbalanced Data -->
  <g transform="translate(325, 210)">
    <rect x="0" y="0" width="255" height="190" rx="16" fill="#F9E0DB" stroke="#2C3539" stroke-width="3"/>
    <text x="127" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#8C2816">⚠️ Trap on 99.9% Normal!</text>
    <rect x="18" y="50" width="219" height="65" rx="10" fill="#FFFFFF" stroke="#2C3539" stroke-width="2"/>
    <text x="127" y="75" text-anchor="middle" font-size="14" font-weight="800" fill="#B8331A">ROC-AUC = 0.99 (Fake!)</text>
    <text x="127" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#5C4038">Huge TN hides False Positives</text>
    <text x="127" y="142" text-anchor="middle" font-size="14" font-weight="800" fill="#232B2E">Overly Optimistic</text>
    <text x="127" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#4A5559">when Positive class is &lt; 1%</text>
  </g>

  <!-- Left Badges -->
  <g transform="translate(55, 455)">
    <rect x="0" y="0" width="252" height="72" rx="36" fill="#DCEAF7" stroke="#2C3539" stroke-width="2.8"/>
    <text x="126" y="32" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">TPR vs FPR Curve</text>
    <text x="126" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#2E4A66">(Includes True Negatives)</text>

    <rect x="272" y="0" width="252" height="72" rx="36" fill="#DCEAF7" stroke="#2C3539" stroke-width="2.8"/>
    <text x="398" y="32" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Best for Balanced Data</text>
    <text x="398" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#2E4A66">(Similar Class Sizes)</text>

    <rect x="0" y="92" width="252" height="72" rx="36" fill="#FBE4D8" stroke="#2C3539" stroke-width="2.8"/>
    <text x="126" y="124" text-anchor="middle" font-size="16" font-weight="800" fill="#1E2629">Recall (재현율): FN 최소화</text>
    <text x="126" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#6E4436">암 진단 / 불량품 절대 놓치면 안됨</text>

    <rect x="272" y="92" width="252" height="72" rx="36" fill="#FBE4D8" stroke="#2C3539" stroke-width="2.8"/>
    <text x="398" y="124" text-anchor="middle" font-size="16" font-weight="800" fill="#1E2629">Precision (정밀도): FP 최소화</text>
    <text x="398" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#6E4436">스팸 필터 / 정상메일 차단 방지</text>
  </g>


  <!-- ================= RIGHT SIDE: PR-AUC (PRECISION-RECALL AUC) ================= -->
  <text x="960" y="132" text-anchor="middle" font-size="28" font-weight="800" fill="#1E2629">PR-AUC (Precision-Recall AUC)</text>
  <text x="960" y="168" text-anchor="middle" font-size="22" font-weight="600" fill="#4A5559">(Severe Class Imbalance: 0.1% Fraud!)</text>

  <!-- Needle in a Haystack Visual -->
  <g transform="translate(690, 210)">
    <rect x="0" y="0" width="250" height="190" rx="16" fill="#D5ECE4" stroke="#2C3539" stroke-width="3"/>
    <text x="125" y="36" text-anchor="middle" font-size="16" font-weight="800" fill="#1E2629">🔍 Severe Imbalance</text>
    
    <!-- Huge 99.9% block vs tiny 0.1% needle -->
    <rect x="28" y="55" width="120" height="95" rx="8" fill="#FFFFFF" stroke="#2C3539" stroke-width="2.5"/>
    <text x="88" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#4A5559">99.9%</text>
    <text x="88" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#5A666B">Normal (TN)</text>

    <rect x="165" y="115" width="58" height="35" rx="6" fill="#F9E0DB" stroke="#2C3539" stroke-width="2.5"/>
    <text x="194" y="138" text-anchor="middle" font-size="14" font-weight="800" fill="#B8331A">0.1%</text>
    <text x="194" y="105" text-anchor="middle" font-size="13" font-weight="800" fill="#8C2816">🚨 Fraud!</text>

    <text x="125" y="174" text-anchor="middle" font-size="13" font-weight="800" fill="#1E4D3B">Ignores 99.9% Normal (TN)!</text>
  </g>

  <!-- Focuses strictly on Positive Class -->
  <g transform="translate(965, 210)">
    <rect x="0" y="0" width="260" height="190" rx="16" fill="#D5ECE4" stroke="#2C3539" stroke-width="3"/>
    <text x="130" y="36" text-anchor="middle" font-size="16" font-weight="800" fill="#1E4D3B">🏆 Rare Event Gold Standard</text>
    <rect x="20" y="52" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#2C3539" stroke-width="2.5"/>
    <text x="130" y="78" text-anchor="middle" font-size="15" font-weight="800" fill="#1E2629">Evaluates ONLY Minority</text>
    <text x="130" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#2B6B55">(Precision &amp; Recall of 0.1%)</text>
    <text x="130" y="148" text-anchor="middle" font-size="14" font-weight="800" fill="#1E2629">Credit Card Fraud, Cancer,</text>
    <text x="130" y="168" text-anchor="middle" font-size="14" font-weight="800" fill="#1E2629">Manufacturing Defect</text>
  </g>

  <!-- Right Badges -->
  <g transform="translate(695, 455)">
    <rect x="0" y="0" width="252" height="72" rx="36" fill="#D5ECE4" stroke="#2C3539" stroke-width="2.8"/>
    <text x="126" y="32" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Severe Class Imbalance</text>
    <text x="126" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#3B5249">(e.g. 99.9% vs 0.1%)</text>

    <rect x="272" y="0" width="252" height="72" rx="36" fill="#D5ECE4" stroke="#2C3539" stroke-width="2.8"/>
    <text x="398" y="32" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Ignores True Negatives</text>
    <text x="398" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#3B5249">(No False Optimism!)</text>

    <rect x="0" y="92" width="252" height="72" rx="36" fill="#D5ECE4" stroke="#2C3539" stroke-width="2.8"/>
    <text x="126" y="124" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">Rare Positive Detection</text>
    <text x="126" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#3B5249">(Fraud / Rare Disease)</text>

    <rect x="272" y="92" width="252" height="72" rx="36" fill="#D5ECE4" stroke="#2C3539" stroke-width="2.8"/>
    <text x="398" y="124" text-anchor="middle" font-size="17" font-weight="800" fill="#1E2629">SMOTE / scale_pos_weight</text>
    <text x="398" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#3B5249">(Imbalance Training Fix)</text>
  </g>
</svg>